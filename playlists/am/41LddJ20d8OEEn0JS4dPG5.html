    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {

        .intro a:hover { color: #111; }

        li {
            counter-increment: n;

            border-bottom: 1px solid #eee;

            gap: 12px;

        li:last-child { border-bottom: none; }

            content: counter(n);

            color: #999;
            min-width: 22px;
            text-align: right;

        }
