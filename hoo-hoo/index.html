<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Hoo Hoo</title>
<meta property="og:title" content="Schroeder, take it away">
<meta property="og:description" content="Roxy Music, &ldquo;Mother of Pearl.&rdquo; Watch Snoopy at 0:17.">
<style>
  :root { --bg:#fff7e0; --ink:#1d1d1d; --accent:#c8102e; --muted:#6b5f4b; }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; background:var(--bg); color:var(--ink);
         font:16px/1.45 Georgia, "Times New Roman", serif;
         display:flex; flex-direction:column; align-items:center; padding:24px 16px 40px; }
  h1 { font:700 clamp(26px,7vw,40px)/1.1 Georgia, serif; margin:0 0 6px; text-align:center; }
  .sub { color:var(--muted); margin:0 0 20px; text-align:center; font-style:italic; }
  .stage { position:relative; width:100%; max-width:720px; aspect-ratio:4/3; background:#000;
           border:4px solid var(--ink); border-radius:6px; overflow:hidden; }
  .stage iframe { position:absolute; inset:-12% -1%; width:102%; height:124%; pointer-events:none; border:0; }
  .cover { position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
           background:rgba(0,0,0,.55); z-index:3; cursor:pointer; border:0; width:100%;
           color:#fff; font:700 22px Georgia, serif; }
  .cover span { background:var(--accent); padding:14px 26px; border-radius:40px; }
  .hoo { position:absolute; right:3%; top:30%; z-index:2; background:#fff; color:#000;
         font:900 clamp(30px,9vw,56px)/1 "Comic Sans MS", "Chalkboard SE", cursive;
         padding:14px 22px; border:4px solid #000; border-radius:50% 46% 52% 44%;
         transform:scale(0) rotate(-8deg); transition:transform .18s cubic-bezier(.3,1.8,.5,1); }
  .hoo::after { content:""; position:absolute; left:18%; bottom:-26px; border:14px solid transparent;
                border-top:22px solid #000; transform:skewX(25deg); }
  .hoo.on { transform:scale(1) rotate(-8deg); }
  .clock { margin-top:10px; color:var(--muted); font:14px ui-monospace, Menlo, monospace; }
  .song { position:absolute; width:1px; height:1px; opacity:0; pointer-events:none; left:-9999px; }
  blockquote { max-width:640px; margin:28px 0 0; padding:0 0 0 16px; border-left:4px solid var(--accent);
               color:var(--muted); font-size:15px; }
</style>
</head>
<body>
  <h1>Schroeder, take it away</h1>
  <p class="sub">Roxy Music, &ldquo;Mother of Pearl&rdquo; (1973)</p>

  <div class="stage">
    <div id="dance"></div>
    <div class="hoo" id="hoo">hoo hoo!</div>
    <button class="cover" id="go"><span>&#9654; Play</span></button>
  </div>
  <div class="clock" id="clock">0:00</div>
  <div class="song"><div id="song"></div></div>

  <blockquote>&ldquo;An extra touch of joy if you can envision Snoopy doing Bryan Ferry&rsquo;s &lsquo;hoo hoo&rsquo; yelp approximately 17 seconds into the track.&rdquo;</blockquote>

<script>
  const SONG = 'MuNMsfFkI_M';   // Roxy Music - Topic, "Mother Of Pearl"
  const DANCE = 'Yt5ipSHzdnM';  // A Charlie Brown Christmas dance scene
  const HOO = [16.6, 19.4];     // when the bubble shows, in song seconds
  const OFFSET = 10;            // dance clip start, so Snoopy is in the wide shot at 0:17
  let song, dance, ready = 0;

  const tag = document.createElement('script');
  tag.src = 'https://www.youtube.com/iframe_api';
  document.head.appendChild(tag);

  window.onYouTubeIframeAPIReady = () => {
    const base = { playsinline: 1, controls: 0, rel: 0, modestbranding: 1 };
    dance = new YT.Player('dance', { videoId: DANCE,
      playerVars: { ...base, mute: 1, loop: 1, playlist: DANCE },
      events: { onReady: () => ready++ } });
    song = new YT.Player('song', { videoId: SONG, playerVars: base,
      events: { onReady: () => ready++ } });
  };

  document.getElementById('go').onclick = (e) => {
    if (ready < 2) return;
    e.currentTarget.remove();
    dance.mute(); dance.seekTo(OFFSET, true); dance.playVideo();
    song.unMute(); song.setVolume(100); song.playVideo();
    setInterval(tick, 100);
  };

  function tick() {
    const t = song.getCurrentTime ? song.getCurrentTime() : 0;
    document.getElementById('hoo').classList.toggle('on', t >= HOO[0] && t <= HOO[1]);
    const s = Math.floor(t);
    document.getElementById('clock').textContent = Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
    if (song.getPlayerState && song.getPlayerState() === 0) dance.pauseVideo();
  }
</script>
</body>
</html>
