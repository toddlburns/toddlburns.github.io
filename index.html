<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todd L. Burns</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Georgia', serif;
            background: #fafafa;
            color: #222;
            min-height: 100vh;
            overflow: hidden;
        }
        h1 {
            position: fixed;
            top: 40px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 28px;
            font-weight: 400;
            letter-spacing: 3px;
            z-index: 10;
            white-space: nowrap;
        }
        .float-link {
            text-decoration: none;
            color: #222;
            font-size: 18px;
            letter-spacing: 1px;
            white-space: nowrap;
            transition: color 0.2s, left 0.8s ease, top 0.8s ease;
            cursor: pointer;
            position: absolute;
        }
        .float-link:hover {
            color: #666;
        }

        /* Serious mode: centered vertical list */
        .serious .float-link {
            position: relative;
            display: block;
            text-align: center;
            transition: none;
        }
        .nav-list {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            display: flex;
            flex-direction: column;
            gap: 16px;
            z-index: 5;
        }

        .bottom {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 13px;
            color: #999;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            white-space: nowrap;
        }
        .bottom a { color: #999; text-decoration: none; }
        .bottom a:hover { color: #222; }

        /* Toggle switch */
        .toggle {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            user-select: none;
            font-size: 12px;
            color: #999;
            letter-spacing: 1px;
        }
        .toggle-track {
            width: 36px;
            height: 18px;
            background: #ccc;
            border-radius: 9px;
            position: relative;
            transition: background 0.3s;
        }
        .toggle-track .knob {
            width: 14px;
            height: 14px;
            background: #fff;
            border-radius: 50%;
            position: absolute;
            top: 2px;
            left: 2px;
            transition: left 0.3s;
        }
        .toggle.active .toggle-track {
            background: #34C759;
        }
        .toggle.active .knob {
            left: 20px;
        }
        .toggle-label-left,
        .toggle-label-right {
            transition: color 0.3s;
        }
        .toggle .toggle-label-left { color: #222; }
        .toggle .toggle-label-right { color: #ccc; }
        .toggle.active .toggle-label-left { color: #ccc; }
        .toggle.active .toggle-label-right {
            background: linear-gradient(90deg, #ff0000, #ff8800, #ffdd00, #00cc00, #0066ff, #8800ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
    </style>
</head>
<body class="serious">
    <h1>Todd L. Burns</h1>

    <nav class="nav-list" id="nav-list"></nav>

    <div class="bottom">
        <div class="toggle" id="mode-toggle">
            <span class="toggle-label-left">Serious</span>
            <div class="toggle-track"><div class="knob"></div></div>
            <span class="toggle-label-right">Fun</span>
        </div>
    </div>

    <script>
        const links = [
            { text: 'Bio', href: '/bio.html' },
            { text: 'Digital Projects', href: '/projects.html' },
            { text: 'Print Projects', href: '/print.html' },
            { text: 'Playlists', href: 'https://toddlburns.github.io/globe-playlists/' },
            { text: 'Hats', href: 'https://toddlburns.github.io/crambe-repetita-hats/' },
            { text: 'Contact', href: 'mailto:todd.burns@gmail.com' },
        ];

        const navList = document.getElementById('nav-list');
        const floaters = [];
        let funMode = false;
        let animId = null;

        links.forEach((link, i) => {
            const el = document.createElement('a');
            el.className = 'float-link';
            el.href = link.href;
            el.textContent = link.text;
            navList.appendChild(el);
            floaters.push({ el, x: 0, y: 0, dx: 0, dy: 0 });
        });

        function startFun() {
            // Capture positions while still in serious layout
            const positions = floaters.map(f => f.el.getBoundingClientRect());

            document.body.classList.remove('serious');
            navList.style.display = 'none';

            floaters.forEach((f, i) => {
                document.body.appendChild(f.el);
                f.x = positions[i].left;
                f.y = positions[i].top;
                f.el.style.left = f.x + 'px';
                f.el.style.top = f.y + 'px';

                const angle = Math.random() * Math.PI * 2;
                const speed = 0.15 + Math.random() * 0.2;
                f.dx = Math.cos(angle) * speed;
                f.dy = Math.sin(angle) * speed;
            });
            funMode = true;
            animate();
        }

        function stopFun() {
            funMode = false;
            if (animId) cancelAnimationFrame(animId);
            animId = null;
            document.body.classList.add('serious');
            navList.style.display = '';
            floaters.forEach(f => {
                f.el.style.left = '';
                f.el.style.top = '';
                navList.appendChild(f.el);
            });
        }

        function animate() {
            if (!funMode) return;
            const w = window.innerWidth;
            const h = window.innerHeight;

            floaters.forEach(f => {
                f.x += f.dx;
                f.y += f.dy;

                const rect = f.el.getBoundingClientRect();

                if (f.x < 20) { f.x = 20; f.dx = Math.abs(f.dx); }
                if (f.x + rect.width > w - 20) { f.x = w - rect.width - 20; f.dx = -Math.abs(f.dx); }
                if (f.y < 90) { f.y = 90; f.dy = Math.abs(f.dy); }
                if (f.y + rect.height > h - 60) { f.y = h - rect.height - 60; f.dy = -Math.abs(f.dy); }

                f.dx += (Math.random() - 0.5) * 0.005;
                f.dy += (Math.random() - 0.5) * 0.005;

                const maxSpeed = 0.4;
                const spd = Math.hypot(f.dx, f.dy);
                if (spd > maxSpeed) {
                    f.dx = (f.dx / spd) * maxSpeed;
                    f.dy = (f.dy / spd) * maxSpeed;
                }

                f.el.style.left = f.x + 'px';
                f.el.style.top = f.y + 'px';
            });

            animId = requestAnimationFrame(animate);
        }

        document.getElementById('mode-toggle').addEventListener('click', () => {
            const toggle = document.getElementById('mode-toggle');
            toggle.classList.toggle('active');
            if (toggle.classList.contains('active')) {
                startFun();
            } else {
                stopFun();
            }
        });

        window.addEventListener('resize', () => {
            if (!funMode) return;
            const newW = window.innerWidth;
            const newH = window.innerHeight;
            floaters.forEach(f => {
                if (f.x > newW - 200) f.x = newW - 200;
                if (f.y > newH - 80) f.y = newH - 80;
            });
        });
    </script>
</body>
</html>
