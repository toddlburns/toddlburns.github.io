<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todd L. Burns</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Georgia', serif;
            background: #fafafa;
            color: #222;
            min-height: 100vh;
            overflow: hidden;
        }
        h1 {
            position: fixed;
            top: 40px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 28px;
            font-weight: 400;
            letter-spacing: 3px;
            z-index: 10;
            white-space: nowrap;
        }
        .float-link {
            position: absolute;
            text-decoration: none;
            color: #222;
            font-size: 18px;
            letter-spacing: 1px;
            white-space: nowrap;
            transition: color 0.2s;
            cursor: pointer;
        }
        .float-link:hover {
            color: #666;
        }
        .email {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 13px;
            color: #999;
            z-index: 10;
        }
        .email a { color: #999; text-decoration: none; }
        .email a:hover { color: #222; }
    </style>
</head>
<body>
    <h1>Todd L. Burns</h1>
    <div class="email"><a href="mailto:todd.burns@gmail.com">todd.burns@gmail.com</a></div>

    <script>
        const links = [
            { text: 'Bio', href: '/bio.html', emoji: '📎' },
            { text: 'Digital Projects', href: '/projects.html', emoji: '💾' },
            { text: 'Print Projects', href: '/print.html', emoji: '📰' },
            { text: 'Playlists', href: 'https://toddlburns.github.io/globe-playlists/', emoji: '🌍' },
            { text: 'Hats', href: 'https://toddlburns.github.io/crambe-repetita-hats/', emoji: '🧢' },
            { text: 'Contact', href: 'mailto:todd.burns@gmail.com', emoji: '✉️' },
        ];

        const floaters = [];
        const w = window.innerWidth;
        const h = window.innerHeight;

        links.forEach((link, i) => {
            const el = document.createElement('a');
            el.className = 'float-link';
            el.href = link.href;
            el.textContent = link.emoji + ' ' + link.text;
            document.body.appendChild(el);

            // Spread them out initially
            const startX = 100 + Math.random() * (w - 300);
            const startY = 120 + ((h - 200) / links.length) * i + Math.random() * 40;

            // Gentle random drift
            const angle = Math.random() * Math.PI * 2;
            const speed = 0.15 + Math.random() * 0.2;

            floaters.push({
                el,
                x: startX,
                y: startY,
                dx: Math.cos(angle) * speed,
                dy: Math.sin(angle) * speed,
            });
        });

        function animate() {
            floaters.forEach(f => {
                f.x += f.dx;
                f.y += f.dy;

                const rect = f.el.getBoundingClientRect();

                // Soft bounce off edges
                if (f.x < 20) { f.x = 20; f.dx = Math.abs(f.dx); }
                if (f.x + rect.width > w - 20) { f.x = w - rect.width - 20; f.dx = -Math.abs(f.dx); }
                if (f.y < 90) { f.y = 90; f.dy = Math.abs(f.dy); }
                if (f.y + rect.height > h - 60) { f.y = h - rect.height - 60; f.dy = -Math.abs(f.dy); }

                // Slight wobble
                f.dx += (Math.random() - 0.5) * 0.005;
                f.dy += (Math.random() - 0.5) * 0.005;

                // Cap speed to keep it gentle
                const maxSpeed = 0.4;
                const spd = Math.hypot(f.dx, f.dy);
                if (spd > maxSpeed) {
                    f.dx = (f.dx / spd) * maxSpeed;
                    f.dy = (f.dy / spd) * maxSpeed;
                }

                f.el.style.left = f.x + 'px';
                f.el.style.top = f.y + 'px';
            });

            requestAnimationFrame(animate);
        }

        animate();

        window.addEventListener('resize', () => {
            const newW = window.innerWidth;
            const newH = window.innerHeight;
            floaters.forEach(f => {
                if (f.x > newW - 200) f.x = newW - 200;
                if (f.y > newH - 80) f.y = newH - 80;
            });
        });
    </script>
</body>
</html>
