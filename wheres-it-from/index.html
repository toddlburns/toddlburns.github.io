<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Genre Guesser</title>
<meta name="description" content="Hear a piece of music, drop a pin where it's from. Detroit techno to Ethiopian jazz, Croydon dubstep to Peruvian chicha. Five rounds.">
<meta property="og:title" content="Genre Guesser">
<meta property="og:description" content="Hear the music. Drop a pin. Lowest total miles wins.">
<meta property="og:url" content="https://toddlburns.com/wheres-it-from/">
<meta property="og:image" content="https://toddlburns.com/wheres-it-from/og.png?v=2">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://toddlburns.com/wheres-it-from/og.png?v=2">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap">
<style>
/* Accentuate's flat terrain map (Leaflet, Esri physical + hillshade, no labels), wrapping sideways, with the night-sky chrome. */
:root{--night:#0a0f1e;--night2:#141b31;--ink:#131722;--ink2:#555c69;--paper:#fbf7ee;--line:#e6dfcf;--ans:#ff5a36;--me:#3ec5ff;--star:#f4efe2;--font:'Atkinson Hyperlegible',system-ui,sans-serif}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:radial-gradient(ellipse at 50% 40%,#18213d 0%,var(--night) 70%);color:var(--ink);font-family:var(--font);overflow:hidden}
#map{position:fixed;inset:0;z-index:1;background:#7ea6c9}
.leaflet-container{font-family:var(--font)}
.leaflet-tile-container img{width:257px!important;height:257px!important;mix-blend-mode:normal!important}  /* hide hairline seams at fractional zoom */
.relief{mix-blend-mode:multiply}
.pin{width:18px;height:18px;border-radius:50%;border:3px solid #fff;box-shadow:0 1px 5px rgba(0,0,0,.45)}
.pin.me{background:var(--me)}.pin.ans{background:var(--ans)}.pin.sm{width:13px;height:13px;border-width:2px}
.leaflet-tooltip.place{font:700 14px var(--font);background:var(--paper);color:var(--ink);border:0;box-shadow:0 2px 8px rgba(0,0,0,.25);padding:4px 8px}
.leaflet-tooltip.place::before{display:none}
.leaflet-bar a.recenter{display:grid;place-items:center;color:#333}
/* map credits behind a small i (Todd) */
.leaflet-control-attribution{font-size:11px;cursor:pointer}
.leaflet-control-attribution.mini:not(.open){font-size:0;width:22px;height:22px;padding:0;margin:0 10px 10px 0;border-radius:50%;background:rgba(20,27,49,.85)!important;display:grid;place-items:center}
.leaflet-control-attribution.mini:not(.open) *{display:none}
.leaflet-control-attribution.mini:not(.open)::before{content:"i";font:italic 700 13px/1 Georgia,serif;color:#fff}
.leaflet-bottom.leaflet-right{bottom:env(safe-area-inset-bottom)}
/* leaderboard */
.board{margin-top:20px;padding-top:14px;border-top:1px solid var(--line)}
.board h3{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink2);margin:0 0 10px}
.board form{display:flex;gap:8px}
.board input{flex:1;min-width:0;font:16px var(--font);height:44px;padding:0 12px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink)}
.board form .btn{margin:0;height:44px;padding:0 14px;font-size:15px}
.lbmsg{font-size:14px;color:var(--ink2);margin:8px 0 0}.lbmsg:empty{display:none}
.board ol{list-style:none;margin:10px 0 0;padding:0;counter-reset:lb}
.board li{display:flex;gap:10px;padding:7px 0;border-bottom:1px solid var(--line);font-size:16px;counter-increment:lb}
.board li:last-child{border-bottom:0}
.board li::before{content:counter(lb);width:2ch;color:var(--ink2);font-weight:700}
.board li.m::before{content:''}
.board li span{flex:1}.board li b{font-weight:700;white-space:nowrap}
.board li.me{color:var(--ans);font-weight:700}
/* top bar: straight on the night sky, no boxes */
.top{position:fixed;top:calc(12px + env(safe-area-inset-top));left:12px;right:12px;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none;z-index:500;color:var(--star)}
.brand,.stats{pointer-events:auto;background:rgba(10,15,30,.72);border-radius:12px;padding:9px 14px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.brand{font-weight:700;font-size:22px;line-height:1}
.brand a{color:inherit;text-decoration:none}
.brand small{display:block;font-weight:400;font-size:13px;color:#9aa3b8;margin-top:5px}
.stats{display:flex;gap:22px;font-size:12px;color:#9aa3b8;font-weight:700;letter-spacing:.08em;text-transform:uppercase;text-align:right}
.stats b{display:block;color:var(--star);font-size:22px;letter-spacing:0;text-transform:none;margin-top:2px}
/* dock */
.dock{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom));z-index:500;display:flex;align-items:center;gap:10px;
  background:rgba(20,27,49,.92);border:1px solid rgba(255,255,255,.12);border-radius:16px;box-shadow:0 8px 30px rgba(0,0,0,.4);padding:8px;max-width:calc(100% - 24px);color:var(--star)}
.play{width:52px;height:52px;border-radius:12px;border:0;background:var(--star);color:var(--night);display:grid;place-items:center;cursor:pointer;flex:none}
.play svg{width:22px;height:22px}
.viz{display:flex;align-items:center;gap:3px;height:36px;width:120px;padding:0 4px}
.viz i{flex:1;background:var(--me);border-radius:2px;height:12%;transition:height .12s}
.hint{font-size:14px;color:#c3c9d6;padding:0 6px;min-width:120px;max-width:210px;line-height:1.25}
.guess{height:52px;border:0;border-radius:12px;padding:0 24px;background:var(--ans);color:#fff;font:700 17px/1 var(--font);cursor:pointer;flex:none}
.guess:disabled{background:#3a4258;color:#7e879c;cursor:default}
/* card */
.card{position:fixed;z-index:600;left:18px;top:88px;width:380px;max-height:calc(100% - 116px);overflow:auto;background:var(--paper);border-radius:16px;box-shadow:0 10px 40px rgba(0,0,0,.45);padding:20px 22px 22px;display:none}
.card.on{display:block}
.head{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;border-bottom:1px solid var(--line);padding-bottom:12px;margin-bottom:4px}
.head .mi{text-align:right;flex:none}.head .lab{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink2)}.head .pts{font-size:34px;font-weight:700;line-height:1.05}
/* Next round always in reach: the actions row sticks to the bottom of the card */
.actions{display:flex;align-items:center;gap:16px;margin-top:16px}.actions .btn{margin:0}.actions .src{margin:0}
.band{display:flex;justify-content:space-between;align-items:baseline;border-bottom:1px solid var(--line);padding-bottom:10px;margin-bottom:12px}
.band .lab{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink2)}
.band .pts{font-size:38px;font-weight:700;line-height:1.1}
.place{font-size:30px;font-weight:700;line-height:1.05}
.country{font-size:16px;color:var(--ink2);margin-top:4px}
.track{margin:14px 0 0;font-size:16px;font-weight:700;line-height:1.3}
.track span{font-weight:400;color:var(--ink2)}
.note{font-size:16px;line-height:1.5;margin:10px 0 0}
.yours{margin-top:14px;padding-top:12px;border-top:1px solid var(--line);font-size:15px;color:var(--ink2);line-height:1.5}
.yours b{color:var(--ink)}
.btn{display:inline-block;margin-top:16px;border:0;border-radius:12px;background:var(--ink);color:#fff;font:700 16px/1 var(--font);padding:14px 20px;cursor:pointer;text-decoration:none}
.btn.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 2px var(--ink);margin-left:8px}
.src{display:block;margin-top:12px;font-size:13px;color:var(--ink2)}
.src a{color:var(--ink2)}
.big{font-size:60px;font-weight:700;line-height:1}
.big small{font-size:22px;color:var(--ink2)}
.rows{margin-top:14px;border-top:1px solid var(--line)}
.rows div{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:16px}
.rows div span:last-child{font-weight:700;white-space:nowrap}
.rows small{color:var(--ink2)}
.intro p{font-size:16px;line-height:1.5;margin:10px 0 0}
.intro h1{font-size:34px;font-weight:700;line-height:1.05;margin:0}
#yt{position:fixed;left:-9999px;top:0;width:200px;height:200px}
@media (max-width:700px){
  .brand{font-size:19px}.brand small{display:none}
  .stats{gap:14px}.stats b{font-size:19px}
  .card{left:0;right:0;top:auto;bottom:0;width:auto;max-height:50%;border-radius:18px 18px 0 0;padding:14px 18px calc(16px + env(safe-area-inset-bottom))}
  .band{padding-bottom:6px;margin-bottom:8px}.band .pts{font-size:30px}.place{font-size:24px}.track{margin-top:8px;font-size:15px}.note{font-size:15px;margin-top:6px}
  .yours{margin-top:10px;padding-top:8px;font-size:14px}.btn{margin-top:12px;padding:12px 18px}.src{margin-top:8px}
  .card{padding-bottom:0}.card>.intro,.card>.board{padding-bottom:calc(16px + env(safe-area-inset-bottom))}
  .head .pts{font-size:28px}.head{padding-bottom:8px}
  .actions{position:sticky;bottom:0;background:var(--paper);margin:10px -18px 0;padding:10px 18px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--line)}
  .intro h1{font-size:28px}.intro p{font-size:15px}
  .place{font-size:26px}
  .viz{width:70px}.hint{display:none}
  body.revealed .dock,body.ended .dock,body.intro .dock{display:none}
  .leaflet-control-zoom{display:none}
  .leaflet-bottom.leaflet-right{top:calc(66px + env(safe-area-inset-top));bottom:auto}
  .leaflet-bottom.leaflet-right .leaflet-control{margin-top:8px}
  .dock{left:12px;right:12px;transform:none;max-width:none;justify-content:space-between}.viz{flex:1;width:auto}
  .top{left:10px;right:10px}.brand,.stats{padding:8px 12px}
}
</style>
</head>
<body>
<div id="map"></div>
<div class="top">
  <div class="brand"><a href="about.html">Genre Guesser</a><small>Hear it. Pin it.</small></div>
  <div class="stats"><div>Round<b id="s-round">–/5</b></div><div>Miles off<b id="s-score">0</b></div></div>
</div>
<div class="dock" id="dock">
  <button class="play" id="play" aria-label="Play"></button>
  <div class="viz" id="viz"></div>
  <div class="hint" id="hint">Loading…</div>
  <button class="guess" id="guess" disabled>Guess</button>
</div>
<div class="card" id="card"></div>
<div id="yt"></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/topojson-client@3/dist/topojson-client.min.js"></script>
<script>
const $ = id => document.getElementById(id);
const ROUNDS = 5, LADDER = [1,1,2,2,3];
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const shuffle = a => { a = a.slice(); for (let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };
const ICON = { play:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 4l14 8-14 8z"/></svg>', pause:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 4h4v16H6zM14 4h4v16h-4z"/></svg>' };
let PLACES = [], player, ytReady = false, S = null, playing = false;

// ---------- map ----------
// Accentuate's flat map: Esri terrain + hillshade, no labels, wraps sideways. Tap to drop the pin.
const map = L.map('map', { zoomControl:false, worldCopyJump:true, zoomSnap:.25, maxBounds:[[-85,-720],[85,720]], maxBoundsViscosity:1 });
// never zoom out past the point where the world fills the screen height: no empty strip above or below
const fillZoom = () => Math.ceil(Math.log2(innerHeight / 256) * 4) / 4;
const homeZoom = () => Math.max(fillZoom(), innerWidth < 700 ? 0 : Math.log2(innerWidth / 256 / 1.15));
const HOME = [25, 12];
function setMin(){ map.setMinZoom(fillZoom()); }
setMin(); map.setView(HOME, homeZoom());
addEventListener('resize', () => { setMin(); if (map.getZoom() < fillZoom()) map.setZoom(fillZoom()); });
let home = () => map.flyTo(HOME, homeZoom(), { duration:.6 });
const Recenter = L.Control.extend({ options:{ position:'bottomright' }, onAdd(){
  const b = L.DomUtil.create('div', 'leaflet-bar'), a = L.DomUtil.create('a', 'recenter', b);
  a.href = '#'; a.title = 'Re-center map'; a.setAttribute('role', 'button'); a.setAttribute('aria-label', 'Re-center map');
  a.innerHTML = '<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="6"/><path d="M12 2v4M12 18v4M2 12h4M18 12h4"/></svg>';
  L.DomEvent.disableClickPropagation(b); L.DomEvent.on(a, 'click', e => { L.DomEvent.preventDefault(e); home(); }); return b; } });
new Recenter().addTo(map);
L.control.zoom({ position:'bottomright' }).addTo(map);
map.attributionControl.setPrefix(false);
const ac = map.attributionControl.getContainer(); ac.classList.add('mini'); ac.title = 'Map credits';
ac.addEventListener('click', e => { if (e.target.tagName !== 'A') ac.classList.toggle('open'); });
L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Physical_Map/MapServer/tile/{z}/{y}/{x}',
  { maxNativeZoom:8, maxZoom:11, attribution:'Terrain © Esri, US National Park Service · Borders: Natural Earth · Audio: YouTube' }).addTo(map);
L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Shaded_Relief/MapServer/tile/{z}/{y}/{x}',
  { maxNativeZoom:13, maxZoom:11, opacity:.35, className:'relief' }).addTo(map);
fetch('https://cdn.jsdelivr.net/npm/world-atlas@2/countries-50m.json').then(r => r.json()).then(w => {
  L.geoJSON(topojson.mesh(w, w.objects.countries, (a, b) => a !== b), { interactive:false, style:{ color:'#3b4a52', weight:.9, opacity:.5 } }).addTo(map);
}).catch(() => {});
const pinIcon = k => L.divIcon({ className:'', html:`<div class="pin ${k}"></div>`, iconSize:[18,18], iconAnchor:[9,9] });
let meMark = null, ansMark = null, line = null, ends = [];
function clearMarks(){ [meMark, ansMark, line, ...ends].forEach(m => m && map.removeLayer(m)); meMark = ansMark = line = null; ends = []; }
// keep the card from covering what the map is showing: side card on desktop, bottom sheet on phones
function pad(){
  const r = $('card').classList.contains('on') ? $('card').getBoundingClientRect() : null;
  if (!r) return { paddingTopLeft:[24, 80], paddingBottomRight:[24, 100] };
  return innerWidth < 700 ? { paddingTopLeft:[36, 84], paddingBottomRight:[36, innerHeight - r.top + 28] }
                          : { paddingTopLeft:[r.right + 30, 90], paddingBottomRight:[60, 60] };
}
map.on('click', e => {
  if (!S || S.revealed || S.over) return;
  S.guess = { lat:e.latlng.lat, lng:e.latlng.lng };
  if (meMark) meMark.setLatLng(e.latlng); else meMark = L.marker(e.latlng, { icon:pinIcon('me') }).addTo(map);
  $('guess').disabled = false;
  hint('Move the pin or hit Guess');
});

// ---------- audio ----------
for (let i=0;i<14;i++) $('viz').appendChild(document.createElement('i'));
function vizTick(){
  const bars = $('viz').children, t = performance.now()/1000;
  for (let i=0;i<bars.length;i++) {
    const h = playing ? 15 + 85*Math.abs(Math.sin(t*(2.2+i*.37) + i)*Math.sin(t*1.3 + i*.8)) : 12;
    bars[i].style.height = h + '%';
  }
  requestAnimationFrame(vizTick);
}
vizTick();
function setPlaying(p){ playing = p; $('play').innerHTML = p ? ICON.pause : ICON.play; }
setPlaying(false);
$('play').addEventListener('click', () => {
  if (!ytReady || !S || S.over) return;
  if (!S.loaded) { load(); return; }
  if (playing) player.pauseVideo(); else player.playVideo();
});
function load(){
  const c = S.clip;
  const [f0, f1] = c.from || [0.25, 0.6];   // where in the track a round may start; some clips only sound like themselves later
  S.start = Math.floor(c.dur * (f0 + Math.random() * (f1 - f0)));
  player.loadVideoById({ videoId:c.id, startSeconds:S.start });
  player.unMute(); player.setVolume(85);
  S.loaded = true;
}
function onState(e){
  if (e.data === YT.PlayerState.PLAYING) setPlaying(true);
  else if (e.data === YT.PlayerState.PAUSED || e.data === YT.PlayerState.ENDED) setPlaying(false);
  if (e.data === YT.PlayerState.ENDED && S && !S.revealed) { player.seekTo(S.start, true); player.playVideo(); }
}
function onYtError(){
  // a clip that won't play: swap in another from the same tier
  if (!S || S.revealed) return;
  S.bad.add(S.clip.id);
  const pick = drawClip(LADDER[S.r], S.used);
  if (pick) { S.place = pick.place; S.clip = pick.clip; S.loaded = false; load(); }
}

// ---------- game ----------
function hint(t){ $('hint').textContent = t; }
function stats(){ $('s-round').textContent = S ? `${Math.min(S.r+1,ROUNDS)}/${ROUNDS}` : '–/5'; $('s-score').textContent = S ? S.results.reduce((a,r)=>a+r.pts,0).toLocaleString() : '0'; }
function drawClip(tier, used){
  // used = place names already in this game; prefer the tier, fall back to neighbours
  for (const t of [tier, tier===1?2:tier-1, 3, 2, 1]) {
    const cands = [];
    PLACES.forEach(p => { if (used.has(p.p)) return; p.clips.forEach(c => { if (c.tier === t && !S.bad.has(c.id)) cands.push({ place:p, clip:c }); }); });
    if (cands.length) return cands[Math.floor(Math.random()*cands.length)];
  }
  return null;
}
function newGame(){
  S = { r:0, results:[], used:new Set(), countries:new Set(), bad:(S && S.bad) || new Set() };
  document.body.classList.remove('ended');
  startRound();
}
function startRound(){
  let pick, tries = 0;
  do { pick = drawClip(LADDER[S.r], S.used); tries++; } while (pick && S.countries.has(pick.place.c) && tries < 30);
  S.place = pick.place; S.clip = pick.clip; S.used.add(pick.place.p); S.countries.add(pick.place.c);
  Object.assign(S, { guess:null, revealed:false, loaded:false });
  clearMarks(); document.body.classList.remove('revealed', 'intro'); $('card').classList.remove('on');
  $('guess').disabled = true; $('guess').textContent = 'Guess';
  home = () => map.flyTo(HOME, homeZoom(), { duration:.6 }); home();
  stats(); setPlaying(false); load();
  hint('Listen, then drag the map and tap where it’s from');
}
function km(a, b){
  const R = 6371, rad = x => x*Math.PI/180;
  const dLat = rad(b.lat-a.lat), dLng = rad(b.lng-a.lng);
  const h = Math.sin(dLat/2)**2 + Math.cos(rad(a.lat))*Math.cos(rad(b.lat))*Math.sin(dLng/2)**2;
  return 2*R*Math.asin(Math.sqrt(h));
}
// the score is simply how far off you were, in miles: lowest total wins
const score = d => Math.round(d * 0.621371);
$('guess').addEventListener('click', () => {
  if (!S || S.revealed || !S.guess) return;
  const ans = { lat:S.place.lat, lng:S.place.lng }, g = S.guess;
  const d = km(g, ans), pts = score(d);
  S.results.push({ place:S.place, clip:S.clip, d, pts });
  S.revealed = true; document.body.classList.add('revealed');
  $('guess').disabled = true; hint('Still playing. Now you know.');
  stats(); showReveal(d, pts, g);
  // draw the line to the nearer copy of the answer, so it never runs the long way round the world
  let gl = L.latLng(g.lat, g.lng); const wrap = gl.lng - ans.lng; if (wrap > 180) gl = L.latLng(gl.lat, gl.lng - 360); if (wrap < -180) gl = L.latLng(gl.lat, gl.lng + 360);
  meMark.setLatLng(gl);
  ansMark = L.marker(ans, { icon:pinIcon('ans') }).addTo(map).bindTooltip(S.place.p, { permanent:true, direction:'top', offset:[0, -10], className:'place' });
  line = L.polyline([gl, ans], { color:'#16181b', weight:2.5, dashArray:'6 7', opacity:.8 }).addTo(map);
  home = () => d < 5 ? map.flyTo(ans, 8, { duration:.8 }) : map.flyToBounds(L.latLngBounds([gl, ans]), { ...pad(), maxZoom:9, duration:.8 });
  home();
});
function fmtMi(m){ return m.toLocaleString() + (m === 1 ? ' mile' : ' miles'); }
function showReveal(d, pts, g){
  const p = S.place, c = S.clip, last = S.r === ROUNDS-1, total = S.results.reduce((a,r)=>a+r.pts,0);
  $('card').innerHTML = `<div class="head"><div><div class="place">${esc(p.p)}</div><div class="country">${esc(p.c)}</div></div>
      <div class="mi"><div class="lab">Miles off</div><div class="pts">${pts.toLocaleString()}</div></div></div>
    <div class="track">${esc(c.a)} — ${esc(c.t)} ${c.y ? `<span>(${c.y})</span>` : ''}</div>
    <p class="note">${esc(p.note)}</p>
    <div class="yours">Your guess: <b id="where">…</b><br>Total so far: <b>${fmtMi(total)}</b> off</div>
    <div class="actions"><button class="btn" id="next">${last ? 'See your score' : 'Next round'}</button>
      <span class="src"><a href="https://www.youtube.com/watch?v=${c.id}&t=${S.start}s" target="_blank" rel="noopener">Hear it on YouTube</a></span></div>`;
  $('card').classList.add('on'); $('card').scrollTop = 0;
  $('next').onclick = () => { if (last) endGame(); else { S.r++; startRound(); } };
  const lng = ((g.lng + 540) % 360) - 180;
  const geo = ft => fetch(`https://geocode.arcgis.com/arcgis/rest/services/World/GeocodeServer/reverseGeocode?f=json&langCode=en${ft}&location=${lng},${g.lat}`).then(r => r.json());
  const label = j => { const a = (j && j.address) || {}; return [a.City || a.Subregion || a.Region, a.CntryName].filter(Boolean).join(', '); };
  geo('&featureTypes=Locality').then(j => label(j) || geo('').then(label))
    .then(s => { $('where').textContent = s || 'open water'; })
    .catch(() => { $('where').textContent = 'your pin'; });
}
function endGame(){
  player.pauseVideo(); S.over = true;
  document.body.classList.add('ended');
  const total = S.results.reduce((a,r)=>a+r.pts,0);
  clearMarks();
  ends = S.results.map(r => L.marker([r.place.lat, r.place.lng], { icon:pinIcon('ans sm') }).addTo(map).bindTooltip(r.place.p, { permanent:true, direction:'top', offset:[0, -8], className:'place' }));
  S.share = `I was ${fmtMi(total)} off on Genre Guesser\n${S.results.map(r => r.pts < 20 ? '🎯' : r.pts < 300 ? '🟢' : r.pts < 1000 ? '🟡' : '⚪').join('')}\ntoddlburns.com/wheres-it-from`;
  $('card').innerHTML = `<div class="band"><div class="lab">Total miles off</div></div>
    <div class="big">${total.toLocaleString()}</div>
    <div class="rows">${S.results.map(r => `<div><span>${esc(r.place.p)} <small>${esc(r.place.c)}</small></span><span>${r.pts.toLocaleString()}</span></div>`).join('')}</div>
    <button class="btn" id="again">Play again</button><button class="btn ghost" id="share">Share</button>
    <div class="board"><h3>All-time leaderboard · fewest miles</h3>
      <form id="lbForm"><input id="lbName" maxlength="20" placeholder="Your name" autocomplete="nickname" aria-label="Your name"><button class="btn" id="lbBtn">Add my score</button></form>
      <p class="lbmsg" id="lbMsg"></p><ol id="lbList"><li class="m"><span>Loading…</span></li></ol></div>`;
  S.total = total; S.submitted = false; myEntry = null;
  try { $('lbName').value = localStorage.getItem('wif-name') || ''; } catch (_) {}
  $('lbForm').onsubmit = submitScore; loadBoard();
  $('card').classList.add('on');
  home = () => map.flyToBounds(L.latLngBounds(S.results.map(r => [r.place.lat, r.place.lng])), { ...pad(), maxZoom:5, duration:.8 }); home();
  $('again').onclick = () => newGame();
  $('share').onclick = async () => {
    try { if (navigator.share) { await navigator.share({ text:S.share }); return; } } catch(e) { return; }
    try { await navigator.clipboard.writeText(S.share); $('share').textContent = 'Copied'; } catch(e) {}
  };
  stats(); $('s-round').textContent = 'Done';
}
/* all-time leaderboard: shares Accentuate's Cloudflare Worker + D1, on the /wif/ route (table scores_wif) */
const LB = 'https://accentuate-leaderboard.todd-burns.workers.dev/wif';
let myEntry = null;
async function loadBoard(){
  try {
    const { top, total } = await (await fetch(LB + '/top?n=10')).json();
    $('lbList').innerHTML = top.length ? top.map(r => `<li class="${myEntry && r.name === myEntry.name && r.score === myEntry.score ? 'me' : ''}"><span>${esc(r.name)}</span><b>${r.score.toLocaleString()} mi</b></li>`).join('') : '<li class="m"><span>No scores yet. Be the first.</span></li>';
    if (myEntry?.rank) $('lbMsg').textContent = `You're #${myEntry.rank} of ${total.toLocaleString()} all time.`;
  } catch (e) { $('lbList').innerHTML = '<li class="m"><span>The leaderboard is unreachable right now.</span></li>'; }
}
async function submitScore(e){
  e.preventDefault();
  const name = $('lbName').value.trim();
  if (!name || S.submitted) return;
  $('lbBtn').disabled = true; $('lbMsg').textContent = 'Saving…';
  try { localStorage.setItem('wif-name', name); } catch (_) {}
  try {
    const r = await fetch(LB + '/score', { method:'POST', headers:{ 'content-type':'application/json' },
      body: JSON.stringify({ name, score:S.total, max:62500, rounds:S.results.map(r => [r.place.p, r.clip.id, r.pts]) }) });
    const d = await r.json();
    if (!r.ok) { $('lbMsg').textContent = d.error && d.error.length > 8 ? d.error : 'That score could not be saved.'; $('lbBtn').disabled = false; return; }
    S.submitted = true; myEntry = { name, score:S.total, rank:d.rank }; $('lbForm').hidden = true; loadBoard();
  } catch (_) { $('lbMsg').textContent = 'Could not reach the leaderboard. Try again in a moment.'; $('lbBtn').disabled = false; }
}
function intro(){
  $('card').innerHTML = `<div class="intro"><h1>Genre Guesser</h1>
    <p>A piece of music plays: Detroit techno, Ethiopian jazz, Croydon dubstep, Peruvian chicha, Balinese gamelan.</p>
    <p>Drop a pin where you think it comes from. Your score is how many miles off you are, added up over five rounds. Lowest wins.</p>
    <button class="btn" id="start" disabled>Loading…</button> <a class="btn ghost" href="about.html">About</a></div>`;
  $('card').classList.add('on'); document.body.classList.add('intro');
}
intro();

// ---------- boot ----------
fetch('places.json?v=7').then(r => r.json()).then(d => { PLACES = d; ready(); });
window.onYouTubeIframeAPIReady = () => {
  player = new YT.Player('yt', { width:200, height:200,
    playerVars:{ playsinline:1, controls:0, disablekb:1, rel:0, fs:0, iv_load_policy:3 },
    events:{ onReady:() => { ytReady = true; ready(); }, onStateChange:onState, onError:onYtError } });
};
const tag = document.createElement('script'); tag.src = 'https://www.youtube.com/iframe_api'; document.head.appendChild(tag);
function ready(){
  if (!(ytReady && PLACES.length)) return;
  hint('Press start');
  const b = $('start'); b.disabled = false; b.textContent = 'Start';
  b.onclick = newGame;
}
</script>
