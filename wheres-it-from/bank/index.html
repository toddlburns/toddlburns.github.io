<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Genre Guesser Sound Bank</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&display=swap">
<style>
/* Every clip in the game, playable and flaggable. Edits stay in this browser until Todd copies them to Claude. */
:root{--paper:#fff;--bg:#f4f6f7;--ink:#18232a;--muted:#5d6b72;--rule:#dfe4e6;--accent:#d7262e;--ok:#1f9d55;--warn:#c27c0e;--font:"Archivo",system-ui,-apple-system,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--paper:#172026;--bg:#0f161a;--ink:#eef2f3;--muted:#9aa8ae;--rule:#2c3940;--accent:#ff5a5f;--ok:#4fd18b;--warn:#f0b13c;color-scheme:dark}}
:root[data-theme="dark"]{--paper:#172026;--bg:#0f161a;--ink:#eef2f3;--muted:#9aa8ae;--rule:#2c3940;--accent:#ff5a5f;--ok:#4fd18b;--warn:#f0b13c;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 var(--font);font-variant-numeric:tabular-nums}
header{position:sticky;top:0;z-index:5;background:var(--paper);border-bottom:1px solid var(--rule);padding:12px 16px}
.top{display:flex;align-items:center;gap:14px;flex-wrap:wrap;max-width:1100px;margin:0 auto}
h1{font:800 20px var(--font);font-stretch:125%;margin:0}
.count{color:var(--muted);font-size:13px}
.filters{display:flex;gap:8px;flex-wrap:wrap;max-width:1100px;margin:10px auto 0}
input,select,textarea{font:14px var(--font);padding:7px 9px;border:1px solid var(--rule);border-radius:8px;background:var(--paper);color:var(--ink)}
input[type=search]{flex:1;min-width:180px}
button{font:650 14px var(--font);border-radius:8px;border:1px solid var(--ink);background:var(--ink);color:var(--paper);padding:7px 12px;cursor:pointer}
button.ghost{background:transparent;color:var(--ink);border-color:var(--rule)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
main{max-width:1100px;margin:0 auto;padding:12px 16px 80px}
/* the player has to stay "visible" for YouTube to play, so by default it sits under a cover the page colour */
#yt{position:fixed;right:16px;bottom:16px;width:320px;height:180px;border-radius:10px;overflow:hidden;background:#000;box-shadow:0 8px 30px rgba(0,0,0,.3);z-index:-2}
#ytcov{position:fixed;right:0;bottom:0;width:360px;height:220px;z-index:-1;background:var(--bg)}
body.showvid #yt{z-index:6}body.showvid #ytcov{display:none}
.place{margin:18px 0 6px}
.place h2{font:800 17px var(--font);font-stretch:112%;margin:0}
.place h2 span{font-weight:500;color:var(--muted);font-size:14px}
.place p{margin:2px 0 0;color:var(--muted);font-size:13px}
.row{background:var(--paper);border:1px solid var(--rule);border-radius:12px;margin:6px 0;padding:10px 12px}
.row.ok{border-color:var(--ok)}.row.flag{border-color:var(--warn)}.row.dropped{opacity:.5}
.row.playing{box-shadow:0 0 0 2px var(--accent)}
.head{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center}
.play{width:34px;height:34px;padding:0;border-radius:50%;background:var(--accent);border-color:var(--accent);color:#fff;font-size:13px}
.who b{font-weight:700}.who .m{color:var(--muted);font-size:13px}
.tags{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.tag{font-size:12px;padding:2px 8px;border-radius:999px;border:1px solid var(--rule);color:var(--muted);white-space:nowrap}
.tag.ok{border-color:var(--ok);color:var(--ok)}.tag.w{border-color:var(--warn);color:var(--warn)}
.ctl{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 0 44px;align-items:center}
.ctl button{font-size:12px;padding:4px 10px;border-radius:999px;background:transparent;color:var(--ink);border-color:var(--rule)}
.ctl button.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.ctl button.v.on{background:var(--ok);border-color:var(--ok);color:#fff}
.ctl button.f.on{background:var(--warn);border-color:var(--warn);color:#fff}
.ctl button.d.on{background:var(--accent);border-color:var(--accent);color:#fff}
.ctl .sep{width:1px;height:18px;background:var(--rule);margin:0 4px}
.ctl input{font-size:13px;padding:4px 8px;flex:1;min-width:200px}
@media (max-width:640px){.head{grid-template-columns:auto 1fr}.tags{grid-column:1/-1;justify-content:flex-start}.ctl{margin-left:0}#yt{width:200px;height:113px}}
</style>
</head>
<body>
<header>
  <div class="top">
    <h1>Sound bank</h1>
    <span class="count" id="count"></span>
    <span style="flex:1"></span>
    <span class="count" id="ecount"></span>
    <button class="ghost" id="vid">Show video</button>
    <button id="copy">Copy changes</button>
  </div>
  <div class="filters">
    <input type="search" id="q" placeholder="Search place, country, artist, note…">
    <select id="fc"><option value="">All countries</option></select>
    <select id="ftier"><option value="">All tiers</option><option value="1">Easy</option><option value="2">Medium</option><option value="3">Hard</option></select>
    <select id="fshow"><option value="">Everything</option><option value="todo">Not vetted yet</option><option value="ok">Marked good</option><option value="flag">Flagged</option><option value="dropped">Deleted</option></select>
  </div>
</header>
<main id="list"></main>
<div id="yt"><div id="ytp"></div></div><div id="ytcov"></div>

<script>
const $ = id => document.getElementById(id);
const esc = t => String(t ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
const fmt = s => { s = Math.max(0, Math.round(s)); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); };
const KEY = 'wif-bank-v1';
const TIER = { 1: 'Easy', 2: 'Medium', 3: 'Hard' };
const FLAGS = { vocals: 'Has words', talk: 'Talking / crowd', place: 'Wrong place', track: 'Wrong track', quality: 'Bad audio' };
let edits = {}; try { edits = JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) {}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(edits)); } catch (e) {} paintCount(); };
const ed = k => edits[k] || (edits[k] = {});
const tidy = k => { const e = edits[k]; if (e && !e.ok && !e.drop && !e.note && !(e.flags || []).length) delete edits[k]; };

let CLIPS = [];
fetch('../places.json?v=' + Date.now()).then(r => r.json()).then(P => {
  P.forEach(p => p.clips.forEach(c => CLIPS.push(Object.assign({ key: p.p + '|' + c.id, place: p }, c))));
  [...new Set(P.map(p => p.c))].sort().forEach(c => $('fc').add(new Option(c, c)));
  render(); paintCount();
});

/* YouTube player. The game starts each round somewhere between 25% and 60% through, so the chips sample that range. */
let yt, ytReady = false, nowKey = null;
window.onYouTubeIframeAPIReady = () => { yt = new YT.Player('ytp', { width: '100%', height: '100%', playerVars: { playsinline: 1, rel: 0 }, events: { onReady: () => ytReady = true } }); };
const s = document.createElement('script'); s.src = 'https://www.youtube.com/iframe_api'; document.head.appendChild(s);
function play(c, at) {
  if (!ytReady) return;
  nowKey = c.key; document.querySelectorAll('.row.playing').forEach(r => r.classList.remove('playing'));
  document.querySelector(`.row[data-k="${CSS.escape(c.key)}"]`)?.classList.add('playing');
  yt.loadVideoById({ videoId: c.id, startSeconds: Math.round(at) });
}

function state(c) { const e = edits[c.key] || {}; return e.drop ? 'dropped' : (e.flags || []).length ? 'flag' : e.ok ? 'ok' : 'todo'; }
function render() {
  const q = $('q').value.toLowerCase(), fc = $('fc').value, ft = $('ftier').value, show = $('fshow').value;
  const rows = CLIPS.filter(c => (!fc || c.place.c === fc) && (!ft || String(c.tier) === ft) && (!show || state(c) === show)
    && (!q || [c.place.p, c.place.c, c.place.note, c.a, c.t, c.id].join(' ').toLowerCase().includes(q)));
  $('count').textContent = `${rows.length} of ${CLIPS.length} clips`;
  let last = null, html = '';
  for (const c of rows) {
    if (c.place !== last) { last = c.place; html += `<div class="place"><h2>${esc(c.place.p)} <span>· ${esc(c.place.c)}</span></h2><p>${esc(c.place.note)}</p></div>`; }
    const e = edits[c.key] || {}, st = state(c), fl = e.flags || [];
    const marks = [25, 40, 55].map(pc => `<button data-at="${c.dur * pc / 100}">▶ ${fmt(c.dur * pc / 100)}</button>`).join('');
    html += `<div class="row ${st === 'todo' ? '' : st} ${nowKey === c.key ? 'playing' : ''}" data-k="${esc(c.key)}">
      <div class="head"><button class="play" data-at="${c.dur * 0.25}" aria-label="Play">▶</button>
        <div class="who"><b>${esc(c.a)}</b> <span class="m">· ${esc(c.t)}${c.y ? ' · ' + c.y : ''}</span></div>
        <div class="tags"><span class="tag">${TIER[c.tier]}</span><span class="tag">${fmt(c.dur)}</span>${st === 'ok' ? '<span class="tag ok">good</span>' : st === 'flag' ? '<span class="tag w">flagged</span>' : st === 'dropped' ? '<span class="tag w">deleted</span>' : ''}<a class="tag" href="https://www.youtube.com/watch?v=${c.id}" target="_blank" rel="noopener">YouTube ↗</a></div></div>
      <div class="ctl">${marks}<span class="sep"></span>
        <button class="v ${e.ok ? 'on' : ''}" data-ok>✓ Good</button>
        ${Object.entries(FLAGS).map(([k, l]) => `<button class="f ${fl.includes(k) ? 'on' : ''}" data-flag="${k}">${l}</button>`).join('')}
        <button class="d ${e.drop ? 'on' : ''}" data-drop>Delete</button></div>
      <div class="ctl"><input data-note value="${esc(e.note)}" placeholder="Note to Claude (where it really is, a better start time…)"></div>
    </div>`;
  }
  $('list').innerHTML = html;
}
function paintCount() {
  const v = Object.values(edits), n = v.filter(e => e.ok).length, f = v.filter(e => (e.flags || []).length || e.drop).length;
  $('ecount').textContent = (n || f) ? `${n} good · ${f} flagged or deleted` : '';
}
$('list').addEventListener('click', ev => {
  const row = ev.target.closest('.row'); if (!row) return;
  const c = CLIPS.find(x => x.key === row.dataset.k), k = c.key, b = ev.target.closest('button');
  if (!b) return;
  if (b.dataset.at != null) { play(c, +b.dataset.at); return; }
  const e = ed(k);
  if (b.hasAttribute('data-ok')) { e.ok = !e.ok; if (e.ok) { e.flags = []; e.drop = false; } }
  else if (b.dataset.flag) { const fl = e.flags || (e.flags = []), i = fl.indexOf(b.dataset.flag); i < 0 ? fl.push(b.dataset.flag) : fl.splice(i, 1); if (fl.length) e.ok = false; }
  else if (b.hasAttribute('data-drop')) { e.drop = !e.drop; if (e.drop) e.ok = false; }
  tidy(k); save(); const y = scrollY; render(); scrollTo(0, y);
});
$('list').addEventListener('change', ev => {
  if (!ev.target.hasAttribute('data-note')) return;
  const k = ev.target.closest('.row').dataset.k; ed(k).note = ev.target.value.trim(); tidy(k); save();
});
['q', 'fc', 'ftier', 'fshow'].forEach(id => $(id).addEventListener('input', render));
$('vid').onclick = () => { document.body.classList.toggle('showvid'); $('vid').textContent = document.body.classList.contains('showvid') ? 'Hide video' : 'Show video'; };
$('copy').onclick = () => {
  const out = {}; for (const [k, e] of Object.entries(edits)) { const o = {}; if (e.ok) o.ok = true; if (e.drop) o.drop = true; if ((e.flags || []).length) o.flags = e.flags; if (e.note) o.note = e.note; out[k] = o; }
  navigator.clipboard?.writeText(JSON.stringify({ wifBank: out }, null, 1)); $('copy').textContent = 'Copied'; setTimeout(() => $('copy').textContent = 'Copy changes', 1600);
};
</script>
</body>
</html>
