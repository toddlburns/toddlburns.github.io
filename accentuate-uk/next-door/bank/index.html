<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Next Door Bank</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400..800&display=swap">
<style>
/* Vetting page for Next Door clips: play each one, mark Drop or Good, copy the changes back to Claude. */
:root{--paper:#fbf9f4;--ink:#13213c;--muted:#5c6478;--rule:#e3e0d8;--accent:#6a2bd9;--bad:#c2372b;--ok:#1f8a4c;--bg:#f3f0e8}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--paper:#161a2e;--ink:#f1f0ec;--muted:#9da3b8;--rule:#2a3050;--accent:#a77bff;--bad:#ff7a6b;--ok:#4cc27f;--bg:#0e1122;color-scheme:dark}}
:root[data-theme="dark"]{--paper:#161a2e;--ink:#f1f0ec;--muted:#9da3b8;--rule:#2a3050;--accent:#a77bff;--bad:#ff7a6b;--ok:#4cc27f;--bg:#0e1122;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 Archivo,system-ui,sans-serif;padding:16px;max-width:900px;margin:0 auto}
h1{font-size:24px;margin:8px 0 4px}
.top{position:sticky;top:0;background:var(--bg);padding:10px 0;z-index:2;display:flex;gap:10px;align-items:center;flex-wrap:wrap;border-bottom:1px solid var(--rule)}
button{font:650 14px Archivo,system-ui,sans-serif;border-radius:9px;border:1px solid var(--ink);background:var(--ink);color:var(--paper);padding:9px 14px;cursor:pointer;min-height:40px}
button.ghost{background:transparent;color:var(--ink);border-color:var(--rule)}
button.on.drop{background:var(--bad);border-color:var(--bad);color:#fff}
button.on.good{background:var(--ok);border-color:var(--ok);color:#fff}
h2{font-size:18px;margin:22px 0 8px}
.clip{background:var(--paper);border:1px solid var(--rule);border-radius:12px;padding:12px;margin-bottom:10px}
.clip.dropped{opacity:.5}
.meta{color:var(--muted);font-size:13px}
.text{margin:6px 0 10px;font-style:italic}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.vid{margin-top:10px;aspect-ratio:16/9;width:100%;max-width:480px}
.vid iframe{width:100%;height:100%;border:0}
input{font:inherit;padding:8px;border:1px solid var(--rule);border-radius:8px;background:transparent;color:inherit;flex:1;min-width:160px}
#msg{color:var(--muted)}
</style>
</head>
<body>
<h1>Next Door bank</h1>
<p class="meta">Every Next Door clip, by town. Play it, then mark Drop (wrong person, reporter, says the place, not local) or Good. Your marks stay in this browser. Copy changes and paste them to Claude.</p>
<div class="top"><button id="copy">Copy changes</button><button class="ghost" id="clear">Clear marks</button><span id="count" class="meta"></span><span id="msg"></span></div>
<div id="list"></div>
<script src="../clips.js?v=4"></script>
<script>
const $ = id => document.getElementById(id);
const KEY = 'nd-bank-v1';
let E = {}; try { E = JSON.parse(localStorage.getItem(KEY) || '{}'); } catch (e) {}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(E)); } catch (e) {} count(); };
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const C = window.NEXTDOOR || [];
function count(){ const n = Object.keys(E).length; $('count').textContent = `${C.length} clips · ${n} marked`; }
function render(){
  const by = {}; C.forEach(c => (by[c.label] = by[c.label] || []).push(c));
  $('list').innerHTML = Object.keys(by).sort().map(l => `<h2>${esc(l)} (${by[l].length})</h2>` + by[l].map(c => {
    const e = E[c.key] || {};
    return `<div class="clip${e.drop ? ' dropped' : ''}" data-k="${esc(c.key)}">
      <div class="meta">${esc(c.title)} · ${c.start}–${c.end}s</div>
      <div class="text">“${esc(c.text)}…”</div>
      <div class="row"><button class="ghost" data-a="play">Play</button>
        <button class="ghost good${e.ok ? ' on' : ''}" data-a="ok">Good</button>
        <button class="ghost drop${e.drop ? ' on' : ''}" data-a="drop">Drop</button>
        <input placeholder="note" value="${esc(e.note || '')}" data-a="note"></div>
      <div class="vid" hidden></div></div>`;
  }).join('')).join('');
}
$('list').addEventListener('click', ev => {
  const b = ev.target.closest('button'); if (!b) return;
  const card = b.closest('.clip'), k = card.dataset.k, c = C.find(x => x.key === k), e = E[k] = E[k] || {};
  if (b.dataset.a === 'play') { const v = card.querySelector('.vid'); v.hidden = false;
    v.innerHTML = `<iframe src="https://www.youtube.com/embed/${c.id}?start=${c.start}&end=${c.end}&autoplay=1&rel=0&playsinline=1" allow="autoplay; encrypted-media"></iframe>`; return; }
  if (b.dataset.a === 'ok') { e.ok = !e.ok; if (e.ok) e.drop = false; }
  if (b.dataset.a === 'drop') { e.drop = !e.drop; if (e.drop) e.ok = false; }
  if (!e.ok && !e.drop && !e.note) delete E[k];
  save(); render();
});
$('list').addEventListener('change', ev => { if (ev.target.dataset.a !== 'note') return;
  const k = ev.target.closest('.clip').dataset.k; E[k] = E[k] || {}; E[k].note = ev.target.value; save(); });
$('copy').onclick = () => navigator.clipboard.writeText(JSON.stringify({ bank:E })).then(() => { $('msg').textContent = 'Copied'; setTimeout(() => $('msg').textContent = '', 1500); });
$('clear').onclick = () => { E = {}; save(); render(); };
render(); count();
</script>
</body>
</html>
