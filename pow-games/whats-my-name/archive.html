<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Archive · What’s My Name?</title>
<meta name="description" content="How MC Guesser works, who's in the crate and where the clips come from.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;700&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--room:#1b1a18;--paper:#f6f3ea;--ink:#22201c;--orange:#c4501c;--teal:#1d6b63}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--room)}
body{font-family:'IBM Plex Mono',monospace;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:28px 16px 60px;background:radial-gradient(ellipse at 50% 0%,#2b2925,var(--room) 70%)}
.receipt{width:100%;max-width:560px;background:var(--paper);color:var(--ink);font-size:14px;line-height:1.6;padding:26px 24px 30px;box-shadow:0 10px 20px rgba(0,0,0,.45);
 -webkit-mask:linear-gradient(#000,#000) top/100% calc(100% - 8px) no-repeat,conic-gradient(from -45deg at bottom,#0000,#000 1deg 89deg,#0000 90deg) bottom/12px 8px repeat-x;
 mask:linear-gradient(#000,#000) top/100% calc(100% - 8px) no-repeat,conic-gradient(from -45deg at bottom,#0000,#000 1deg 89deg,#0000 90deg) bottom/12px 8px repeat-x}
h1{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:40px;line-height:1;text-transform:uppercase;margin-bottom:14px}
h2{font-family:'Barlow Condensed',sans-serif;font-size:15px;font-weight:700;text-transform:uppercase;letter-spacing:.2em;color:var(--orange);margin:4px 0 6px}
p+p{margin-top:9px} hr{border:0;border-top:1px dashed #b9b3a4;margin:18px 0} a{color:var(--teal)} .dim{color:#6f6a5f}
.arc{list-style:none;margin:0;padding:0}
.arc li a{display:flex;gap:14px;align-items:baseline;padding:10px 0;border-bottom:1px dashed rgba(0,0,0,.2);text-decoration:none;color:inherit}
.arc li a:hover b{text-decoration:underline}
.arc b{min-width:3.2em}
.arc span{flex:1}
.arc em{font-style:normal;font-weight:600}
.arc .none{padding:10px 0;opacity:.7}
</style>
</head>
<body>
<div class="receipt">
<h1>Archive</h1>
<p>Missed a day? Play any past crate. Archive plays don’t count toward your streak.</p>
<hr>
<ul class="arc" id="list"></ul>
<hr>
<p><a href="./">← Today’s crate</a></p>
</div>
<script>
// same clock and storage as the game: crate #1 = Nov 12, 2026 (LA midnight); results live in this browser only
const EPOCH = Date.UTC(2026, 10, 12);
const get = (k, d) => { try { const v = localStorage.getItem('mcgd-' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } };
const o = {}; new Intl.DateTimeFormat('en-CA', { timeZone: 'America/Los_Angeles', year: 'numeric', month: '2-digit', day: '2-digit' }).formatToParts(new Date()).forEach(p => o[p.type] = p.value);
const today = Math.round((Date.UTC(+o.year, +o.month - 1, +o.day) - EPOCH) / 864e5) + get('offset', 0);
const plays = get('plays', {}), aplays = get('aplays', {});
const fmt = d => new Date(EPOCH + d * 864e5 + 12 * 36e5).toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric', timeZone: 'UTC' });
const rows = [];
for (let d = today - 1; d >= 0; d--) {
  const r = plays[d] || aplays[d];
  rows.push(`<li><a href="./?crate=${d + 1}"><b>#${d + 1}</b><span>${fmt(d)}</span><em>${r ? r.score + '/100' : 'Play'}</em></a></li>`);
}
document.getElementById('list').innerHTML = rows.length ? rows.join('') : '<li class="none">No past crates yet.</li>';
</script>
</body>
</html>
