<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Feature Path</title>
<meta name="description" content="Get from one rapper to another through guest verses, in as few hops as you can.">
<meta name="theme-color" content="#171717">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=IBM+Plex+Mono:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../shared/pow.css">
<style>
.ends{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;margin:12px 0}
.ends div{border:2px solid #3a3a3a;border-radius:10px;padding:10px;text-align:center}
.ends div.t{border-color:var(--l2)}
.ends b{display:block;font:400 22px/1 var(--display);text-transform:uppercase}
.ends small{font:700 10px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--mute)}
.ends .arr{font:400 26px var(--display);color:var(--red)}
.trail{display:flex;flex-wrap:wrap;align-items:center;gap:4px;margin:8px 0;font-size:13px}
.trail span.n{font:400 15px var(--display);text-transform:uppercase;background:#262626;padding:4px 7px;border-radius:4px}
.trail span.s{font:italic 12px var(--sans);color:var(--mute)}
.cur{margin:14px 0 6px}
.cur .big{margin:0}
.opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px;margin:8px 0}
.opts button{appearance:none;text-align:left;border:1px solid #3a3a3a;background:var(--tile);color:var(--ink);border-radius:8px;padding:9px 10px;cursor:pointer}
.opts button:hover{border-color:var(--red)}
.opts button b{display:block;font:400 17px/1 var(--display);text-transform:uppercase}
.opts button span{display:block;font-size:12px;color:var(--mute);margin-top:3px}
.opts button.goal{border-color:var(--l2);background:#1d2a1d}
.opts button.been{opacity:.45}
.bar{display:flex;justify-content:space-between;font:600 12px var(--mono);text-transform:uppercase;letter-spacing:.06em}
.filt{margin:6px 0}
</style>
</head>
<body data-game="feature-path" data-title="Feature Path" data-kicker="POW MAG · Six degrees of the guest verse">
<div class="wrap" id="wrap">
  <div class="strip"><span id="pnum">Feature Path</span><span id="pdate"></span></div>
  <p class="lede">Get from the first rapper to the second through songs they made together. Each hop goes to someone your current rapper has a track with. Try to match par.</p>
  <div class="ends"><div><small>Start</small><b id="s"></b></div><span class="arr">→</span><div class="t"><small>Target</small><b id="t"></b></div></div>
  <div class="bar"><span id="moves"></span><span id="par"></span></div>
  <div class="trail" id="trail"></div>
  <div class="cur"><p class="kick">You're on</p><h2 class="big" id="cur"></h2></div>
  <div class="filt"><input class="guess" id="f" placeholder="Filter collaborators…" aria-label="Filter collaborators"></div>
  <div class="opts" id="opts"></div>
  <div class="row"><button class="btn" id="back" type="button">Back one hop</button><button class="btn" id="giveup" type="button">Show me a path</button></div>
  <div id="toast" role="status" aria-live="assertive"></div>
  <section id="results" hidden aria-labelledby="res-h">
    <h2 id="res-h"></h2><p class="verdict" id="verdict"></p>
    <div class="trail" id="ftrail"></div>
    <div class="grid-share" id="emo"></div>
    <button class="btn primary" id="share" type="button">Copy result</button>
    <div id="stats"></div><p class="next" id="next"></p><div id="signup"></div>
    <div class="reading"><h3>Do the reading</h3><p class="sub">Everyone on your path, in the POW archive.</p><ul id="reading"></ul></div>
  </section>
</div>
<script src="../shared/pow.js"></script>
<script>
(async () => {
  const { $, esc } = PG;
  const data = await PG.load('puzzles.json');
  const D = PG.day(data.launch, data.puzzles.length), n = D.n, P = data.puzzles[n - 1], G = data.graph;
  $('pnum').innerHTML = `Feature Path #${n} ${D.practice ? '<span class="tag practice">Practice · no streak</span>' : '<span class="tag">Daily</span>'}`;
  $('pdate').textContent = D.practice ? D.label : PG.dateFor(data.launch, n);
  $('s').textContent = P.s; $('t').textContent = P.t; $('par').textContent = `Par ${P.par}`;
  const key = 'x' + n, S = PG.store.get(key, null) || { path: [P.s], songs: [], moves: 0, done: false, won: false };
  const save = () => PG.store.set(key, S);
  const cur = () => S.path[S.path.length - 1];
  function trail(el, path, songs) { el.innerHTML = path.map((p, i) => `${i ? `<span class="s">“${esc(songs[i - 1])}”</span>` : ''}<span class="n">${esc(p)}</span>`).join(''); }
  function draw() {
    $('cur').textContent = cur(); $('moves').textContent = `${S.moves} hop${S.moves === 1 ? '' : 's'}`;
    trail($('trail'), S.path, S.songs);
    const f = PG.norm($('f').value), c = cur();
    const opts = Object.entries(G[c]).filter(([a]) => !f || PG.norm(a).includes(f)).sort((a, b) => (b[0] === P.t) - (a[0] === P.t) || a[0].localeCompare(b[0]));
    $('opts').innerHTML = opts.map(([a, song]) => `<button type="button" data-a="${esc(a)}" class="${a === P.t ? 'goal' : ''} ${S.path.includes(a) ? 'been' : ''}"><b>${esc(a)}</b><span>“${esc(song)}”</span></button>`).join('');
    document.querySelectorAll('#opts button').forEach(b => b.onclick = () => hop(b.dataset.a));
    $('back').disabled = S.path.length < 2 || S.done; [$('f'), $('opts'), $('back'), $('giveup')].forEach(x => x.hidden = S.done);
  }
  $('f').addEventListener('input', draw);
  function hop(a) {
    if (S.done) return;
    S.songs.push(G[cur()][a]); S.path.push(a); S.moves++; $('f').value = '';
    if (a === P.t) { S.done = true; S.won = true; }
    save(); draw(); window.scrollTo({ top: $('trail').offsetTop - 80, behavior: 'smooth' });
    if (S.done) finish(true);
    else if (S.moves === P.par) setTimeout(() => PG.nag('miss', { kick: 'Past par', head: 'Still digging?', body: 'POW MAG has been connecting these dots since 2005. Get it in your inbox, free.' }), 1200);
  }
  $('back').onclick = () => { if (S.path.length > 1 && !S.done) { S.path.pop(); S.songs.pop(); S.moves++; save(); draw(); } };
  function shortest() {
    const prev = { [P.s]: null }, q = [P.s];
    for (const x of q) { if (x === P.t) break; for (const y in G[x]) if (!(y in prev)) { prev[y] = x; q.push(y); } }
    const p = []; for (let x = P.t; x; x = prev[x]) p.unshift(x); return p;
  }
  $('giveup').onclick = () => { S.done = true; S.won = false; save(); draw(); finish(true); };
  function finish(fresh) {
    const st = PG.record(n, S.won, D.practice), over = S.moves - P.par;
    $('res-h').textContent = S.won ? (over <= 0 ? 'Par. Perfect.' : `${S.moves} hops (+${over})`) : 'Gave up.';
    $('verdict').textContent = S.won ? (over <= 0 ? 'Shortest possible route. You know who\'s been in the booth together.' : over <= 2 ? 'Got there with a detour or two.' : 'Scenic route. You got there.') : 'Here\'s the shortest way through.';
    const sp = S.won ? S.path : shortest(), ss = S.won ? S.songs : sp.slice(1).map((a, i) => G[sp[i]][a]);
    trail($('ftrail'), sp, ss);
    $('emo').textContent = `${P.s} → ${P.t}\n` + (S.won ? '🎤'.repeat(Math.min(S.moves, 12)) + (over <= 0 ? ' ⛳' : '') : '❌');
    $('stats').innerHTML = PG.statsHTML(st); PG.countdown($('next'), 'path'); $('signup').innerHTML = PG.signupBox("Get tomorrow's path in your inbox");
    $('reading').innerHTML = [...new Set(sp)].map(a => `<li><a href="${PG.search(a)}" target="_blank" rel="noopener">${esc(a)}</a></li>`).join('');
    $('results').hidden = false; if (fresh) setTimeout(() => PG.popResults(), 300);
  }
  $('share').onclick = () => PG.copy(`Feature Path #${n} · ${S.won ? `${S.moves} hops (par ${P.par})` : 'DNF'}\n${$('emo').textContent}\npassionweiss.com`);
  draw(); if (S.done) finish(false);
  setTimeout(() => PG.nag('land', { kick: `Feature Path #${n}`, head: 'A new path every day', body: 'Get POW MAG, the newsletter Passion of the Weiss has turned into. Free.' }), 1500);
})();
</script>
</body>
</html>
