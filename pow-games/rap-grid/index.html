<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Rap Grid</title>
<meta name="description" content="A daily rap grid. Nine squares, nine guesses. Name an MC who fits both clues.">
<meta name="theme-color" content="#171717">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=IBM+Plex+Mono:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../shared/pow.css">
<style>
#gridwrap{display:grid;grid-template-columns:.9fr repeat(3,1fr);gap:5px;margin:14px 0 8px}
.clue{display:flex;align-items:center;justify-content:center;text-align:center;font:600 11.5px/1.2 var(--mono);text-transform:uppercase;letter-spacing:.03em;padding:6px 4px;min-height:58px;color:var(--ink)}
.clue.col{border-bottom:3px solid var(--red)} .clue.row{border-right:3px solid var(--red);justify-content:flex-end;text-align:right}
.sq{appearance:none;aspect-ratio:1;border:2px solid #3a3a3a;background:var(--tile);color:var(--ink);cursor:pointer;padding:4px;display:flex;flex-direction:column;align-items:center;justify-content:center;
  font:400 15px/1 var(--display);text-transform:uppercase;text-align:center;border-radius:0;position:relative;overflow:hidden}
.sq:hover:not(:disabled){border-color:var(--red)}
.sq.got{background:var(--l2);border-color:var(--l2);color:#111;cursor:default}
.sq.got .pct{position:absolute;bottom:3px;right:4px;font:700 10px var(--mono);background:#111;color:#fff;padding:1px 4px}
.sq.miss{background:#262626;color:var(--mute)}
.sq:disabled{cursor:default}
.sq .plus{font-size:28px;color:#555}
.bar{display:flex;justify-content:space-between;font:600 12px var(--mono);text-transform:uppercase;letter-spacing:.06em;margin:6px 0}
#pick{position:fixed;inset:0;background:rgba(0,0,0,.8);display:flex;align-items:flex-start;justify-content:center;padding:12vh 16px 16px;z-index:50}
#pick[hidden]{display:none}
#pick .card{width:100%;max-width:460px;background:#171717}
#pick h3{font:400 22px/1.05 var(--display);text-transform:uppercase;margin:0 0 10px}
#pick h3 i{font-style:normal;color:var(--red)}
.answers{font-size:14px;line-height:1.6}
.answers h4{font:700 12px var(--mono);text-transform:uppercase;margin:14px 0 2px;letter-spacing:.05em}
.answers a{font-weight:600}
.answers .you{background:var(--l2);color:#111;padding:0 4px}
@media (min-width:600px){.clue{font-size:13px}.sq{font-size:19px}}
</style>
</head>
<body data-game="rap-grid" data-title="Rap Grid" data-kicker="POW MAG · Daily grid">
<div class="wrap" id="wrap">
  <div class="strip"><span id="pnum">Rap Grid</span><span id="pdate"></span></div>
  <p class="lede">Fill each square with an MC who fits both clues. Nine guesses for the day, and each MC only once. The rarer your pick, the better your score.</p>
  <div id="gridwrap"></div>
  <div class="bar"><span id="left"></span><span id="rarity"></span></div>
  <div id="toast" role="status" aria-live="assertive"></div>
  <button class="btn" id="giveup" type="button" style="width:100%">I'm done, show me the answers</button>
  <section id="results" hidden aria-labelledby="res-h">
    <h2 id="res-h"></h2><p class="verdict" id="verdict"></p>
    <div class="grid-share" id="emo"></div>
    <button class="btn primary" id="share" type="button">Copy result</button>
    <div id="stats"></div><p class="next" id="next"></p><div id="signup"></div>
    <div class="reading"><h3>Every right answer</h3><p class="sub">From the POW Games MC list. Tap a name for its POW archive coverage.</p><div class="answers" id="answers"></div></div>
  </section>
</div>
<div id="pick" hidden role="dialog" aria-modal="true" aria-labelledby="pick-h">
  <div class="card"><h3 id="pick-h"></h3><div class="ac"><input class="guess" id="q" placeholder="Type an MC…" aria-label="MC name"></div>
  <p class="hint">Each guess counts, right or wrong. <a href="#" id="pick-x">Cancel</a></p></div>
</div>
<script src="../shared/pow.js"></script>
<script>
(async () => {
  const { $, esc } = PG;
  const [data, mcs] = await Promise.all([PG.load('grids.json'), PG.load('../shared/mcs.json')]);
  const D = PG.day(data.launch, data.grids.length), n = D.n, G = data.grids[n - 1];
  $('pnum').innerHTML = `Rap Grid #${n} ${D.practice ? '<span class="tag practice">Practice · no streak</span>' : '<span class="tag">Daily</span>'}`;
  $('pdate').textContent = D.practice ? D.label : PG.dateFor(data.launch, n);
  let bid = PG.store.gget('bid', null); if (!bid) { bid = 'b' + crypto.getRandomValues(new Uint32Array(3)).join('-').slice(0, 30); PG.store.gset('bid', bid); }
  const key = 'g' + n, S = PG.store.get(key, null) || { cells: {}, used: [], guesses: 9, wrong: [], done: false };
  const save = () => PG.store.set(key, S);
  const kc = (r, c) => `${r}-${c}`, tkey = (r, c) => `rg${n}:${r}-${c}`;
  let tallies = {};
  const pct = (r, c) => { const t = tallies[tkey(r, c)], nm = S.cells[kc(r, c)]; if (!t || !t.total || !nm) return null; return Math.max(1, Math.round(100 * (t.counts[nm] || 1) / t.total)); };

  function draw() {
    const w = $('gridwrap'); w.innerHTML = '<div></div>' + G.cols.map(c => `<div class="clue col">${esc(data.clues[c].text)}</div>`).join('');
    G.rows.forEach((rid, r) => {
      w.insertAdjacentHTML('beforeend', `<div class="clue row">${esc(data.clues[rid].text)}</div>`);
      G.cols.forEach((cid, c) => {
        const nm = S.cells[kc(r, c)], p = pct(r, c);
        const b = document.createElement('button'); b.type = 'button';
        b.className = 'sq' + (nm ? ' got' : S.done ? ' miss' : '');
        b.setAttribute('aria-label', `${data.clues[rid].text} and ${data.clues[cid].text}${nm ? ': ' + nm : ''}`);
        b.innerHTML = nm ? `${esc(nm)}${p ? `<span class="pct">${p}%</span>` : ''}` : S.done ? '—' : '<span class="plus">+</span>';
        b.disabled = !!nm || S.done; b.onclick = () => openPick(r, c);
        w.appendChild(b); if (nm) fit(b);
      });
    });
    $('left').textContent = `${S.guesses} guess${S.guesses === 1 ? '' : 'es'} left`;
    const rs = score(); $('rarity').textContent = Object.keys(S.cells).length ? `Rarity ${rs}` : '';
    $('giveup').hidden = S.done;
  }
  function fit(el) { requestAnimationFrame(() => { let fs = parseFloat(getComputedStyle(el).fontSize), i = 0; while ((el.scrollWidth > el.clientWidth + 1 || el.scrollHeight > el.clientHeight + 1) && fs > 9 && i++ < 14) { fs--; el.style.fontSize = fs + 'px'; } }); }
  // rarity = sum of each square's pick % plus 100 for an empty square (lower is better, like the real thing)
  const score = () => { let s = 0; for (let r = 0; r < 3; r++) for (let c = 0; c < 3; c++) s += S.cells[kc(r, c)] ? (pct(r, c) ?? 50) : 100; return s; };

  let cur = null;
  const items = mcs.map(m => ({ label: m.n, sub: m.c, keys: m.a, m }));
  PG.autocomplete($('q'), items, it => guess(it.m.n));
  function openPick(r, c) {
    if (S.done) return; cur = [r, c];
    $('pick-h').innerHTML = `<i>${esc(data.clues[G.rows[r]].text)}</i> + <i>${esc(data.clues[G.cols[c]].text)}</i>`;
    $('pick').hidden = false; $('q').value = ''; $('q').focus();
  }
  const closePick = () => { $('pick').hidden = true; cur = null; };
  $('pick-x').onclick = e => { e.preventDefault(); closePick(); };
  $('pick').addEventListener('click', e => { if (e.target === $('pick')) closePick(); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('pick').hidden) closePick(); });

  async function guess(name) {
    if (!cur) return; const [r, c] = cur; closePick();
    if (S.used.includes(name)) { PG.toast(`Already used ${name}. One appearance per grid.`); return; }
    S.guesses--;
    const right = G.cells[r][c].includes(name);
    if (right) {
      S.cells[kc(r, c)] = name; S.used.push(name); save();
      const t = await PG.api('/grid', { k: tkey(r, c), bid, pick: name }); if (t) Object.assign(tallies, t);
      PG.toast(['Bars.', 'Correct. Put some respect on it.', 'That\'s a lock.', 'Clean.'][S.guesses % 4], 1200);
      if (Object.keys(S.cells).length === 1) setTimeout(() => PG.nag('first', { kick: 'One square down', head: 'Like this?', body: 'POW MAG has written about every MC on this list since 2005. Get it in your inbox, free.' }), 1500);
    } else {
      S.wrong.push([r, c, name]); save();
      PG.toast(`${name}? Not this square.`, 2000);
      if (S.wrong.length === 1) setTimeout(() => PG.nag('miss', { kick: 'Wrong square', head: 'Do the reading', body: 'Twenty years of interviews, reviews and features on these MCs. Get POW MAG, free.' }), 2200);
    }
    if (S.guesses <= 0 || Object.keys(S.cells).length === 9) { S.done = true; save(); }
    draw(); if (S.done) finish(true);
  }
  $('giveup').onclick = () => { S.done = true; save(); draw(); finish(true); };

  function finish(fresh) {
    const got = Object.keys(S.cells).length, st = PG.record(n, got >= 5, D.practice);
    $('res-h').textContent = got === 9 ? 'Immaculate.' : got >= 6 ? `${got} of 9.` : got >= 1 ? `${got} of 9. Rough.` : 'Zero. Bold.';
    $('verdict').textContent = `Rarity score ${score()} (lower is better). ` + (got === 9 ? 'Every square. Frame it.' : got >= 6 ? 'You know your crews.' : 'The answers are below. Study up.');
    $('emo').textContent = [0, 1, 2].map(r => [0, 1, 2].map(c => S.cells[kc(r, c)] ? '🟩' : '⬛').join('')).join('\n');
    $('stats').innerHTML = PG.statsHTML(st); PG.countdown($('next'), 'grid'); $('signup').innerHTML = PG.signupBox("Get tomorrow's grid in your inbox");
    $('answers').innerHTML = G.rows.map((rid, r) => G.cols.map((cid, c) => {
      const t = tallies[tkey(r, c)], you = S.cells[kc(r, c)];
      const list = G.cells[r][c].slice().sort((a, b) => ((t?.counts[b] || 0) - (t?.counts[a] || 0)) || a.localeCompare(b));
      return `<h4>${esc(data.clues[rid].text)} + ${esc(data.clues[cid].text)}</h4>${list.map(x => `<a class="${x === you ? 'you' : ''}" href="${PG.search(x)}" target="_blank" rel="noopener">${esc(x)}</a>${t?.total ? ` <small class="mute">${Math.round(100 * (t.counts[x] || 0) / t.total)}%</small>` : ''}`).join(' · ')}`;
    }).join('')).join('');
    $('results').hidden = false; if (fresh) setTimeout(() => PG.popResults(), 300);
  }
  $('share').onclick = () => PG.copy(`Rap Grid #${n} · ${Object.keys(S.cells).length}/9 · Rarity ${score()}\n${$('emo').textContent}\npassionweiss.com`);

  const ks = []; for (let r = 0; r < 3; r++) for (let c = 0; c < 3; c++) ks.push(tkey(r, c));
  draw();
  PG.api('/grid?k=' + ks.join(',')).then(t => { if (t) { tallies = t; draw(); if (S.done) finish(false); } });
  if (S.done) finish(false);
  setTimeout(() => PG.nag('land', { kick: `Rap Grid #${n}`, head: 'A new grid every day', body: 'Get POW MAG, the newsletter Passion of the Weiss has turned into, and never miss a grid. Free.' }), 1500);
})();
</script>
</body>
</html>
