    <div class="shr" id="shr"><a class="btn" data-s="x" aria-label="Share on X" title="X" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18.901 1.153h3.68l-8.04 9.19L24 22.846h-7.406l-5.8-7.584-6.638 7.584H.474l8.6-9.83L0 1.154h7.594l5.243 6.932ZM17.61 20.644h2.039L6.486 3.24H4.298Z" fill="currentColor"/></svg></a><a class="btn" data-s="threads" aria-label="Share on Threads" title="Threads" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12.186 24h-.007c-3.581-.024-6.334-1.205-8.184-3.509C2.35 18.44 1.5 15.586 1.472 12.01v-.017c.03-3.579.879-6.43 2.525-8.482C5.845 1.205 8.6.024 12.18 0h.014c2.746.02 5.043.725 6.826 2.098 1.677 1.29 2.858 3.13 3.509 5.467l-2.04.569c-1.104-3.96-3.898-5.984-8.304-6.015-2.91.022-5.11.936-6.54 2.717C4.307 6.504 3.616 8.914 3.589 12c.027 3.086.718 5.496 2.057 7.164 1.43 1.783 3.631 2.698 6.54 2.717 2.623-.02 4.358-.631 5.8-2.045 1.647-1.613 1.618-3.593 1.09-4.798-.31-.71-.873-1.3-1.634-1.75-.192 1.352-.622 2.446-1.284 3.272-.886 1.102-2.14 1.704-3.73 1.79-1.202.065-2.361-.218-3.259-.801-1.063-.689-1.685-1.74-1.752-2.964-.065-1.19.408-2.285 1.33-3.082.88-.76 2.119-1.207 3.583-1.291a13.853 13.853 0 0 1 3.02.142c-.126-.742-.375-1.332-.75-1.757-.513-.586-1.308-.883-2.359-.89h-.029c-.844 0-1.992.232-2.721 1.32L7.734 7.847c.98-1.454 2.568-2.256 4.478-2.256h.044c3.194.02 5.097 1.975 5.287 5.388.108.046.216.094.321.142 1.49.7 2.58 1.761 3.154 3.07.797 1.82.871 4.79-1.548 7.158-1.85 1.81-4.094 2.628-7.277 2.65Zm1.003-11.69c-.242 0-.487.007-.739.021-1.836.103-2.98.946-2.916 2.143.067 1.256 1.452 1.839 2.784 1.767 1.224-.065 2.818-.543 3.086-3.71a10.5 10.5 0 0 0-2.215-.221z" fill="currentColor"/></svg></a><a class="btn" data-s="bsky" aria-label="Share on Bluesky" title="Bluesky" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 10.8c-1.087-2.114-4.046-6.053-6.798-7.995C2.566.944 1.561 1.266.902 1.565.139 1.908 0 3.08 0 3.768c0 .69.378 5.65.624 6.479.815 2.736 3.713 3.66 6.383 3.364.136-.02.275-.039.415-.056-.138.022-.276.04-.415.056-3.912.58-7.387 2.005-2.83 7.078 5.013 5.19 6.87-1.113 7.823-4.308.953 3.195 2.05 9.271 7.733 4.308 4.267-4.308 1.172-6.498-2.74-7.078a8.741 8.741 0 0 1-.415-.056c.14.017.279.036.415.056 2.67.297 5.568-.628 6.383-3.364.246-.828.624-5.79.624-6.478 0-.69-.139-1.861-.902-2.206-.659-.298-1.664-.62-4.3 1.24C16.046 4.748 13.087 8.687 12 10.8Z" fill="currentColor"/></svg></a><button class="btn" type="button" data-s="copy" aria-label="Copy link" title="Copy link"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10.6 13.4a4 4 0 0 0 5.66 0l3.54-3.54a4 4 0 0 0-5.66-5.66l-1.06 1.06M13.4 10.6a4 4 0 0 0-5.66 0L4.2 14.14a4 4 0 0 0 5.66 5.66l1.06-1.06" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg></button></div>

<div class="rback" id="rback"></div>
<div class="nag" id="nag" hidden role="dialog" aria-modal="true" aria-label="Sign up for POW MAG">
  <div class="nag-card"><img class="nag-mark" src="pow-wordmark.png" alt="POW MAG"><div id="nag-body"></div>
    <div class="nag-row"><button class="btn" id="nag-on" type="button">I'm on the list</button><button class="btn" id="nag-close" type="button">Not now, keep playing</button></div>
  </div>
</div>
<script src="cypher.js"></script>
<script>
(async () => {
  const $ = id => document.getElementById(id);
  const EMO = { 1: '🟧', 2: '🟩', 3: '🟪', 4: '🟦' };
  const WRONG = ['Nope. Not a group. Not even a mixtape.', 'Respectfully, no.', "That's a reach.", 'Wrong crew.', 'Somebody in there is lying to you.'];
  const WIN = ['Flawless. Put it on a tee.', 'Clean. One brick and nobody saw it.', "Got there. Not pretty, but it counts.", 'Survived on fumes, like a sophomore album.'];
  const LOSS = ['Out of lives. The archive is right below. Study up.', 'Fell off. It happens to the best of us, and also to you.', 'Four bricks. Put the phone down and go read something.'];

  const data = await Cy.load();
  const q = new URLSearchParams(location.search);
  let n = Cy.todayNum(data), practice = false, label = 'Today';
  if (q.get('date') && /^\d{4}-\d{2}-\d{2}$/.test(q.get('date'))) { n = Cy.numFor(data, q.get('date')); practice = true; label = 'Preview ' + q.get('date'); }
  else if (q.get('n')) { const k = parseInt(q.get('n'), 10); if (k >= 1 && k <= data.puzzles.length && k <= Cy.todayNum(data)) { n = k; practice = k !== Cy.todayNum(data); label = practice ? 'Archive' : 'Today'; } }
  let P = data.puzzles[n - 1], md = null;
  // calendar preview: ?md=01-14 plays that date's puzzle from calendar.json, with its occasion line
  if (/^\d{2}-\d{2}$/.test(q.get('md') || '')) {
    const cal = await fetch('calendar.json', { cache: 'no-cache' }).then(r => r.json()).catch(() => ({}));
    if (cal[q.get('md')]) { md = q.get('md'); P = cal[md]; practice = true; }
  }
  const groupOf = {}; P.groups.forEach(g => g.tiles.forEach(t => groupOf[t] = g));

  $('pnum').textContent = md ? `Posse Cut · ${new Date('2001-' + md + 'T12:00:00').toLocaleDateString('en-US', { month: 'long', day: 'numeric' })}` : `Posse Cut #${String(n).padStart(3, '0')}`;
  if (md && P.occasion) { const o = document.createElement('p'); o.className = 'occasion' + (P.big ? ' big' : ''); o.textContent = P.occasion; $('lede').before(o); }

  const key = md ? 'cal' + md : 'p' + n;
  const saved = Cy.store.get(key, null);
  const S = saved || { order: shuffle(P.groups.flatMap(g => g.tiles)), solved: [], guesses: [], lives: 4, done: false, won: false };
  let sel = [];

  function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.random() * (i + 1) | 0; [a[i], a[j]] = [a[j], a[i]]; } return a; }
  const save = () => Cy.store.set(key, S);
  const levelOf = t => groupOf[t].level;

  // ---------- POW sign-up pop-ups: never block play; each kind once a day; gone for good after "I'm on the list" ----------
  const NAG_OFF = q.has('nonag');
  const subbed = () => Cy.store.get('sub', false);
  const EMBED = '<iframe class="ss" src="https://www.powmag.net/embed" title="Sign up for POW MAG" scrolling="no"></iframe>';
  const NAG = {
    land:  () => ({ kick: `Posse Cut #${n}`, head: 'A new board every day', body: 'Get POW MAG, the newsletter Passion of the Weiss has turned into, and never miss a Posse Cut. Free.' }),
    first: () => ({ kick: 'One group down', head: 'Like this?', body: 'POW MAG has been writing about every name on this board since 2005. Get it in your inbox, free.' }),
    miss:  () => ({ kick: 'Wrong crew', head: 'Do the reading', body: 'Twenty years of interviews, reviews and features on the rappers on this board. Get POW MAG in your inbox, free.' }),
  };
  function nag(kind) {
    return; // all sign-up pop-ups off for now (Todd 2026-11-25)
    if (NAG_OFF || subbed() || Cy.store.get('nag-' + kind, '') === Cy.laDate()) return;
    if (!$('nag').hidden || popped) return;
    // once the board is finished the results card carries the sign-up, so no mid-game pop-up
    if (S.done && kind !== 'land') return;
    Cy.store.set('nag-' + kind, Cy.laDate());
    const c = NAG[kind]();
    $('nag-body').innerHTML = `<p class="kick">${c.kick}</p><p class="big">${c.head}</p><p>${c.body}</p>${EMBED}`;
    $('nag').hidden = false; $('nag-close').focus();
  }
  function closeNag() { $('nag').hidden = true; $('nag-body').innerHTML = ''; }
  const markSubbed = () => { Cy.store.set('sub', true); $('signup').innerHTML = ''; };
  $('nag-close').onclick = closeNag;
  $('nag-on').onclick = () => { markSubbed(); closeNag(); };
  $('nag').addEventListener('click', e => { if (e.target === $('nag')) closeNag(); });
  // pop-ups wait until the results card is back in place
  function later(f, ms = 1400) { if (popped) afterPop = f; else setTimeout(f, ms); }

  // ---------- desktop: results pop to centre; Close sends them back under the board ----------
  const wide = () => innerWidth > 900;
  let popped = false, afterPop = null;
  function flip(el, change) {
    const a = el.getBoundingClientRect(); change(); const b = el.getBoundingClientRect();
    const base = popped ? 'translate(-50%,-50%) ' : '';
    el.animate([{ transform: `${base}translate(${a.left - b.left}px,${a.top - b.top}px) scale(${a.width / b.width})`, transformOrigin: 'top left' },
                { transform: base || 'none', transformOrigin: 'top left' }], { duration: 420, easing: 'cubic-bezier(.2,.8,.2,1)' });
  }
  function popResults() {
    if (!wide() || popped) return;
    const r = $('results');
    flip(r, () => { popped = true; r.classList.add('pop'); });
    $('rback').classList.add('on'); r.scrollTop = 0;
  }
  function unpop() {
    if (!popped) return;
    const r = $('results');
    flip(r, () => { popped = false; r.classList.remove('pop'); });
    $('rback').classList.remove('on');
    const f = afterPop; afterPop = null; if (f) setTimeout(f, 500);
  }
  $('rx').onclick = unpop;
  $('rback').onclick = unpop;

  function toast(msg, ms = 1800) { $('toast').innerHTML = msg ? `<span>${msg}</span>` : ''; clearTimeout(toast.t); if (msg && ms) toast.t = setTimeout(() => $('toast').innerHTML = '', ms); }

  function render(popLevel) {
    const b = $('board'); b.innerHTML = '';
    S.solved.map(l => P.groups.find(g => g.level === l)).forEach(g => {
      const d = document.createElement('div');
      d.className = `solved L${g.level}` + (g.level === popLevel ? ' pop' : '');
      d.setAttribute('role', 'group');
      d.setAttribute('aria-label', `Group ${g.level} of 4, ${g.name}: ${g.tiles.join(', ')}`);
      d.innerHTML = `<span class="lvl" aria-hidden="true">${g.level}</span><h3>${g.name}</h3><p>${g.tiles.join(' · ')}</p>`;
      b.appendChild(d);
    });
    S.order.filter(t => !S.solved.includes(levelOf(t))).forEach(t => {
      const btn = document.createElement('button');
      btn.type = 'button'; btn.className = 'tile'; btn.textContent = t;
      btn.setAttribute('aria-pressed', sel.includes(t));
      btn.disabled = S.done;
      btn.onclick = () => toggle(t);
      b.appendChild(btn);
      fit(btn);
    });
    $('lives').innerHTML = [0, 1, 2, 3].map(i => `<i class="${i < S.lives ? '' : 'gone'}"></i>`).join('');
    $('lives-sr').textContent = `${S.lives} of 4 lives left`;
    $('submit').disabled = sel.length !== 4 || S.done;
    $('deselect').disabled = !sel.length || S.done;
    $('shuffle').disabled = S.done;
  }
  // shrink long names so they never break the grid
  function fit(el) {
    requestAnimationFrame(() => {
      let fs = parseFloat(getComputedStyle(el).fontSize);
      el.style.fontSize = '';
      fs = parseFloat(getComputedStyle(el).fontSize);
      let i = 0;
      while ((el.scrollHeight > el.clientHeight + 1 || el.scrollWidth > el.clientWidth + 1) && fs > 9 && i++ < 12) { fs -= 1; el.style.fontSize = fs + 'px'; }
    });
  }
  function toggle(t) {
    if (S.done) return;
    if (sel.includes(t)) sel = sel.filter(x => x !== t);
    else if (sel.length < 4) sel.push(t);
    else { toast('Four max. This isn\'t a posse cut.'); return; }
    const focusText = t;
    render();
    [...document.querySelectorAll('.tile')].find(x => x.textContent === focusText)?.focus();
  }
  function submit() {
    if (sel.length !== 4 || S.done) return;
    const sig = sel.slice().sort().join('|');
    if (S.guesses.some(g => g.slice().sort().join('|') === sig)) { toast('You tried that already. Bold.'); return; }
    S.guesses.push(sel.slice());
    const lv = sel.map(levelOf);
    const counts = {}; lv.forEach(l => counts[l] = (counts[l] || 0) + 1);
    const top = Math.max(...Object.values(counts));
    if (top === 4) {
      S.solved.push(lv[0]); sel = [];
      if (S.solved.length === 4) { S.done = true; S.won = true; }
      save(); render(lv[0]);
      toast(groupOf[S.guesses.at(-1)[0]].name, 1400);
      if (S.done) finish();
      else if (S.solved.length === 1) later(() => nag('first'));
      return;
    }
    S.lives--;
    const tiles = [...document.querySelectorAll('.tile[aria-pressed="true"]')];
    tiles.forEach(x => { x.classList.remove('shake'); void x.offsetWidth; x.classList.add('shake'); });
    if (top === 3) toast('One away. So close it\'s embarrassing.', 2200);
    else toast(WRONG[(S.guesses.length) % WRONG.length]);
    if (S.lives <= 0) { S.done = true; S.won = false; sel = []; }
    save();
    if (S.done) { setTimeout(revealAll, 700); } else { render(); later(() => nag('miss'), 1800); }
  }
  function revealAll() {
    const left = P.groups.filter(g => !S.solved.includes(g.level)).sort((a, b) => a.level - b.level);
    let i = 0;
    (function step() {
      if (i >= left.length) { save(); finish(); return; }
      S.solved.push(left[i].level); render(left[i].level); i++; setTimeout(step, 650);
    })();
  }
  function recordStats() {
    if (practice || S.counted) return;
    const st = Cy.store.get('stats', { played: 0, wins: 0, streak: 0, max: 0, last: 0 });
    st.played++;
    if (S.won) { st.wins++; st.streak = st.last === n - 1 ? st.streak + 1 : 1; st.last = n; st.max = Math.max(st.max, st.streak); }
    else { st.streak = 0; st.last = 0; }
    Cy.store.set('stats', st); S.counted = true; save();
  }
  function shareText() {
    return `${md ? $('pnum').textContent : `Posse Cut #${String(n).padStart(3, '0')}`} on POW MAG\n` + S.guesses.map(g => g.map(t => EMO[levelOf(t)]).join('')).join('\n');
  }
  function finish(fresh = true) {
    recordStats();
    render();
    const mistakes = 4 - S.lives;
    $('res-h').textContent = S.won ? (mistakes === 0 ? 'Perfect.' : 'Solved.') : 'Game over.';
    $('verdict').textContent = S.won ? WIN[Math.min(mistakes, 3)] : LOSS[n % LOSS.length];
    $('grid').textContent = S.guesses.map(g => g.map(t => EMO[levelOf(t)]).join('')).join('\n');
    const st = Cy.store.get('stats', { played: 0, wins: 0, streak: 0, max: 0 });
    $('stats').innerHTML = [['Played', st.played], ['Win %', st.played ? Math.round(100 * st.wins / st.played) : 0], ['Streak', st.streak], ['Max', st.max]]
      .map(([k, v]) => `<div><b>${v}</b><span>${k}</span></div>`).join('');
    $('reading').innerHTML = P.groups.slice().sort((a, b) => a.level - b.level).map(g =>
      `<div class="grp g${g.level}"><h4>${g.level} · ${g.name}</h4><ul>${g.tiles.map(t => `<li><a href="${Cy.search(t)}" target="_blank" rel="noopener">${t}</a></li>`).join('')}</ul></div>`).join('');
    // no sign-up on the scorecard: the game may be for paid subscribers only (Todd 2026-11-24)
    wireShare();
    $('results').hidden = false;
    tick(); clearInterval(finish.iv); finish.iv = setInterval(tick, 1000);
    if (fresh && wide()) setTimeout(popResults, 250);
    else if (fresh) setTimeout(() => $('res-h').scrollIntoView({ behavior: 'smooth', block: 'start' }), 150);
    $('res-h').setAttribute('tabindex', '-1'); $('res-h').focus({ preventScroll: true });
  }
  function tick() {
    const ms = Cy.msToMidnightLA(), h = ms / 36e5 | 0, m = ms / 6e4 % 60 | 0, s = ms / 1e3 % 60 | 0;
    $('next').innerHTML = `Next Posse Cut in <b>${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}</b>`;
  }
  // share buttons, same set as Memory Lane: X, Threads, Bluesky, copy
  async function copyText(txt) {
    try { await navigator.clipboard.writeText(txt); toast('Copied. Go start some beef.'); }
    catch (e) {
      const ta = document.createElement('textarea'); ta.value = txt; document.body.appendChild(ta); ta.select();
      try { document.execCommand('copy'); toast('Copied. Go start some beef.'); } catch (e2) { toast('Couldn\'t copy. Screenshot it like it\'s 2012.'); }
      ta.remove();
    }
  }
  function wireShare() {
    const url = location.origin + location.pathname, e = encodeURIComponent, txt = shareText();
    const links = { x: `https://x.com/intent/post?text=${e(txt)}&url=${e(url)}`, threads: `https://www.threads.net/intent/post?text=${e(txt + '\n' + url)}`, bsky: `https://bsky.app/intent/compose?text=${e(txt + '\n' + url)}` };
    document.querySelectorAll('#shr [data-s]').forEach(a => { if (links[a.dataset.s]) a.href = links[a.dataset.s]; else a.onclick = () => copyText(txt + '\n' + url); });
  }
  $('shuffle').onclick = () => { const solvedT = S.order.filter(t => S.solved.includes(levelOf(t))); S.order = solvedT.concat(shuffle(S.order.filter(t => !solvedT.includes(t)))); save(); render(); };
  $('deselect').onclick = () => { sel = []; render(); };
  $('submit').onclick = submit;
  document.addEventListener('keydown', e => {
    if (e.key === 'Enter' && sel.length === 4 && !(e.target.closest && e.target.closest('a,#shr,#shuffle,#deselect'))) { e.preventDefault(); submit(); }
    if (e.key === 'Escape') { if (!$('nag').hidden) closeNag(); else if (popped) unpop(); else { sel = []; render(); } }
  });
  render();
  // a finished board on reload stays in place; only a fresh finish pops
  if (S.done) finish(false);
