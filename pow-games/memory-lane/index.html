<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Memory Lane</title>
<meta name="description" content="Five rap moments. Put them in order. Three tries.">
<meta name="theme-color" content="#171717">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=IBM+Plex+Mono:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../shared/pow.css">
<style>
.axis{font:700 11px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--mute);margin:12px 0 4px}
.list{list-style:none;margin:0 0 4px;padding:0;display:grid;gap:6px}
.list li{display:grid;grid-template-columns:30px 1fr 44px;gap:8px;align-items:center;border:2px solid #3a3a3a;background:var(--tile);border-radius:10px;padding:10px 8px;transition:transform .15s}
.list li .k{font:400 24px/1 var(--display);color:#666;text-align:center}
.list li p{margin:0;font-size:15px;line-height:1.3}
.list li .yr{display:block;font:700 12px var(--mono);color:var(--l2);margin-top:3px}
.list li .mv{display:grid;gap:3px}
.list li .mv button{appearance:none;border:1px solid #444;background:#1c1c1c;color:#ddd;border-radius:5px;height:24px;cursor:pointer;font-size:13px}
.list li .mv button:disabled{opacity:.25;cursor:default}
.list li.ok{border-color:var(--l2);background:#1b281b}
.list li.ok .k{color:var(--l2)}
.list li.moved{animation:pop .25s}
.tries{display:flex;justify-content:center;gap:8px;margin:10px 0;font:600 12px var(--mono);text-transform:uppercase;letter-spacing:.08em}
.tries i{width:14px;height:14px;border:2px solid var(--red);background:var(--red);display:inline-block;transform:rotate(45deg)}
.tries i.gone{background:transparent}
</style>
</head>
<body data-game="chronology" data-title="Memory Lane" data-kicker="POW MAG · Rap history in order">
<div class="wrap" id="wrap">
  <div class="strip"><span id="pnum">Memory Lane</span><span id="pdate"></span></div>
  <p class="lede">Five moments from rap history. Put them in order, oldest at the top. Anything in the right spot locks green. You get three tries.</p>
  <p class="axis">▲ Oldest</p><ol class="list" id="list"></ol><p class="axis">▼ Newest</p>
  <div class="tries"><span>Tries</span><span id="tries"></span></div>
  <div id="toast" role="status" aria-live="assertive"></div>
  <button class="btn primary" id="submit" type="button" style="width:100%">Lock in this order</button>
  <section id="results" hidden aria-labelledby="res-h">
    <h2 id="res-h"></h2><p class="verdict" id="verdict"></p>
    <div class="grid-share" id="emo"></div>
    <button class="btn primary" id="share" type="button">Copy result</button>
    <div id="stats"></div><p class="next" id="next"></p><div id="signup"></div>
  </section>
</div>
<script src="../shared/pow.js"></script>
<script>
(async () => {
  const { $, esc } = PG;
  const data = await PG.load('puzzles.json');
  const D = PG.day(data.launch, data.days.length), n = D.n, E = data.days[n - 1];
  $('pnum').innerHTML = `Memory Lane #${n} ${D.practice ? '<span class="tag practice">Practice · no streak</span>' : '<span class="tag">Daily</span>'}`;
  $('pdate').textContent = D.practice ? D.label : PG.dateFor(data.launch, n);
  const truth = E.map((e, i) => i).sort((a, b) => E[a].d.localeCompare(E[b].d));
  const key = 'c' + n, S = PG.store.get(key, null) || { order: E.map((e, i) => i), tries: [], done: false, won: false };
  const save = () => PG.store.set(key, S);
  const okAt = i => S.tries.length && S.order[i] === truth[i];
  const fmt = s => new Date(s + 'T12:00:00Z').toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric', timeZone: 'UTC' });
  let moved = -1;
  function draw() {
    $('list').innerHTML = S.order.map((ei, i) => { const lock = okAt(i) || S.done;
      return `<li class="${okAt(i) ? 'ok' : ''} ${i === moved ? 'moved' : ''}"><span class="k">${i + 1}</span><p>${esc(E[ei].t)}${S.done ? `<span class="yr">${fmt(E[ei].d)}</span>` : okAt(i) ? `<span class="yr">${E[ei].d.slice(0, 4)}</span>` : ''}</p>
        <span class="mv"><button type="button" aria-label="Move up" data-i="${i}" data-d="-1" ${lock || i === 0 ? 'disabled' : ''}>▲</button><button type="button" aria-label="Move down" data-i="${i}" data-d="1" ${lock || i === 4 ? 'disabled' : ''}>▼</button></span></li>`; }).join('');
    document.querySelectorAll('.mv button').forEach(b => b.onclick = () => move(+b.dataset.i, +b.dataset.d));
    $('tries').innerHTML = [0, 1, 2].map(i => `<i class="${i < 3 - S.tries.length ? '' : 'gone'}"></i>`).join('');
    $('submit').hidden = S.done;
  }
  // moving skips over locked rows so they stay put
  function move(i, d) {
    let j = i + d; while (j >= 0 && j < 5 && okAt(j)) j += d;
    if (j < 0 || j > 4) return;
    [S.order[i], S.order[j]] = [S.order[j], S.order[i]]; moved = j; save(); draw(); moved = -1;
    document.querySelector(`.mv button[data-i="${j}"][data-d="${d}"]`)?.focus();
  }
  $('submit').onclick = () => {
    if (S.done) return;
    const row = S.order.map((ei, i) => ei === truth[i]); S.tries.push(row);
    const right = row.filter(Boolean).length;
    if (right === 5) { S.done = true; S.won = true; }
    else if (S.tries.length >= 3) { S.done = true; S.order = truth.slice(); }
    save(); draw();
    if (S.done) finish(true);
    else { PG.toast(right ? `${right} in the right spot. They're locked.` : 'None in the right spot. Shuffle up.', 2000); if (S.tries.length === 1) setTimeout(() => PG.nag('miss', { kick: 'History lesson', head: 'Do the reading', body: 'POW MAG has been writing rap history as it happened since 2005. Get it free.' }), 2200); }
  };
  function finish(fresh) {
    const st = PG.record(n, S.won, D.practice);
    $('res-h').textContent = S.won ? (S.tries.length === 1 ? 'First try.' : `Solved in ${S.tries.length}.`) : 'Out of tries.';
    $('verdict').textContent = S.won ? (S.tries.length === 1 ? 'You were there, or you read every liner note.' : 'Got the timeline straight.') : 'The real order is above, with dates.';
    $('emo').textContent = S.tries.map(r => r.map(x => x ? '🟩' : '⬛').join('')).join('\n');
    $('stats').innerHTML = PG.statsHTML(st); PG.countdown($('next'), 'timeline'); $('signup').innerHTML = PG.signupBox("Get tomorrow's timeline in your inbox");
    $('results').hidden = false; if (fresh) setTimeout(() => PG.popResults(), 300);
  }
  $('share').onclick = () => PG.copy(`Memory Lane #${n}\n${$('emo').textContent}\npassionweiss.com`);
  draw(); if (S.done) finish(false);
  setTimeout(() => PG.nag('land', { kick: `Memory Lane #${n}`, head: 'Rap history, daily', body: 'Get POW MAG, the newsletter Passion of the Weiss has turned into. Free.' }), 1500);
})();
</script>
</body>
</html>
