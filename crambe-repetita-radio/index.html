<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Todd L. Burns's Stylus Magazine record reviews, turned into music on twelve stations, from quiet classical and ambient in his own voice to New Age, Berlin School, woodblock, jazz fusion, soundtrack funk, IDM, dub techno, 303 acid, electro and Italo disco. Each piece lasts exactly as long as the album it reviewed.">
<title>Crambe Repetita Radio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sacramento&display=swap">
<style>
*{box-sizing:border-box}
body{margin:0}
[hidden]{display:none!important}
/* Layout: one full-bleed field of light the music paints; quiet fixed type in Times New Roman (as the Crambe Repetita Museum); the station name rides the top; a point of light at the centre; Todd's Serious/Fun switch at the foot. Single dark world by choice. */
:root{
  --ink:#05070B; --fg:#EEF0F4; --dim:rgba(238,240,244,.62); --faint:rgba(238,240,244,.38); --line:rgba(238,240,244,.2);
  --on:#34C759; --track:rgba(238,240,244,.28);
  --face:"Times New Roman",Times,serif;
  --site:Georgia,"Times New Roman",serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--ink);color:var(--fg);overflow:hidden;font-family:var(--face)}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block}
.top{position:fixed;left:0;right:0;top:0;z-index:2;padding-inline:16px;padding-top:calc(env(safe-area-inset-top,0px) + 22px);display:flex;flex-direction:column;align-items:center;gap:12px;pointer-events:none}
h1{font-family:var(--face);font-weight:400;font-size:clamp(1.15rem,3.2vw,2.4rem);line-height:1;letter-spacing:.01em;margin:0;white-space:nowrap}
.now{margin:0;font-family:var(--face);font-size:.85rem;letter-spacing:.02em;color:var(--dim);text-align:center;max-width:40rem;line-height:1.6;font-variant-numeric:tabular-nums;transition:opacity 1.6s ease}
.now .np-time{font-size:.75rem;color:var(--faint)}
.now .np-word{font-size:.8rem;color:var(--dim)}
.now .np-label{font-size:.7rem;letter-spacing:.14em;color:var(--faint)}
.now .np-the{font-size:1.05rem;font-style:italic;color:var(--fg)}

body.quiet .now,body.quiet .tuner,body.quiet .how{opacity:0}
/* the stations: same review, same moment, seven ways of playing it; then the notes on how */
.tuner{display:flex;align-items:center;gap:2px;pointer-events:auto;transition:opacity 1.6s ease;max-width:100%}   /* the stations as a radio's tuning dial (Todd 2026-10-14): one line, the station you are on in the middle */
.dial{position:relative;width:min(calc(100vw - 88px),560px);height:38px;overflow:hidden;cursor:grab;touch-action:pan-y;-webkit-mask-image:linear-gradient(90deg,transparent,#000 24%,#000 76%,transparent);mask-image:linear-gradient(90deg,transparent,#000 24%,#000 76%,transparent)}
.dial.drag{cursor:grabbing}
.dial::before{content:"";position:absolute;left:0;right:0;bottom:3px;height:5px;background:repeating-linear-gradient(90deg,var(--faint) 0 1px,transparent 1px 9px);opacity:.45;pointer-events:none}
.dial::after{content:"";position:absolute;left:50%;bottom:0;width:1px;height:12px;background:var(--fg);opacity:.8;pointer-events:none}
.stations{position:absolute;left:0;top:0;display:flex;flex-wrap:nowrap;align-items:baseline;gap:0 22px;white-space:nowrap;transition:transform .45s cubic-bezier(.2,.8,.2,1);will-change:transform}
.tuner .arrow{border:0;background:transparent;color:var(--dim);font-family:var(--face);font-size:1.05rem;line-height:1;padding:6px 8px;cursor:pointer}
.tuner .arrow:hover{color:var(--fg)}
.how{margin-top:-4px;pointer-events:auto;font-family:var(--site);font-style:italic;font-size:.8rem;letter-spacing:.02em;color:#D9B26F;text-decoration:none;border-bottom:1px solid rgba(217,178,111,.35);padding:2px 0 1px;transition:opacity 1.6s ease}
.how:hover{color:#F0CD8E}
@media (max-width:520px){.stations{gap:0 16px}}
.stations button{border:0;background:transparent;color:var(--faint);font-family:var(--face);font-size:.7rem;letter-spacing:.14em;text-transform:uppercase;padding:6px 2px;cursor:pointer;border-bottom:1px solid transparent}
.stations button:hover{color:var(--dim)}
.stations button[aria-pressed="true"]{color:var(--fg);border-bottom-color:var(--line)}
/* Play / Pause: just the symbol, floating on the light */
#play{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:2;border:0;background:transparent;color:var(--fg);cursor:pointer;padding:24px;display:grid;place-items:center;transition:opacity .6s}
#play svg{width:clamp(40px,6vw,56px);height:clamp(40px,6vw,56px);fill:currentColor;filter:drop-shadow(0 0 18px rgba(0,0,0,.25))}
#play[data-state="on"]{opacity:.3}
#play:hover,#play:focus-visible{opacity:1}
#play[aria-busy="true"]{opacity:.5}
.status{position:fixed;left:16px;right:16px;top:calc(50% + 70px);text-align:center;font-size:.7rem;letter-spacing:.08em;color:var(--dim);margin:0;z-index:2}
/* Serious/Fun: the same switch as toddlburns.com */
.bottom{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 24px);z-index:2}
.toggle{display:flex;align-items:center;gap:8px;cursor:pointer;user-select:none;font-family:var(--site);font-size:12px;letter-spacing:1px;color:var(--faint);text-decoration:none}
.toggle-track{width:36px;height:18px;background:var(--track);border-radius:9px;position:relative;transition:background .3s}
.toggle-track .knob{width:14px;height:14px;background:#fff;border-radius:50%;position:absolute;top:2px;left:2px;transition:left .3s}
.toggle.active .toggle-track{background:var(--on)}
.toggle.active .knob{left:20px}
.toggle-label-left,.toggle-label-right{transition:color .3s}
.toggle .toggle-label-left{color:var(--fg)}
.toggle .toggle-label-right{color:var(--faint)}
.toggle.active .toggle-label-left{color:var(--faint)}
.toggle.active .toggle-label-right{background:linear-gradient(90deg,#ff0000,#ff8800,#ffdd00,#00cc00,#0066ff,#8800ff);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
:focus-visible{outline:2px solid var(--fg);outline-offset:3px}
/* two lines in a hand-written cursive, written letter by letter onto a line that waves like the light */
#fx{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none;display:none}
body[data-station="woodblock"] #fx,body[data-station="dub"] #fx,body[data-station="electro"] #fx,body[data-station="idm"] #fx,body[data-station="berlin"] #fx,body[data-station="italo"] #fx,body[data-station="newage"] #fx,body[data-station="soundtrack"] #fx{display:block}
body[data-station="woodblock"] #phrases,body[data-station="classical"] #phrases,body[data-station="dub"] #phrases,body[data-station="electro"] #phrases,body[data-station="idm"] #phrases,body[data-station="berlin"] #phrases,body[data-station="italo"] #phrases,body[data-station="newage"] #phrases,body[data-station="soundtrack"] #phrases{display:none}
#phrases{position:fixed;inset:0;width:100%;height:100%;z-index:1;pointer-events:none;mix-blend-mode:soft-light}
#phrases text{font-family:"Sacramento","Snell Roundhand","Apple Chancery",cursive;font-size:clamp(1.7rem,3.4vw,2.9rem);fill:#fff}
/* Fusion: the two lines as cut-out paper shards in two rings, turning with the kaleidoscope */
#shards{position:fixed;inset:0;z-index:1;pointer-events:none;display:none;overflow:hidden}
body[data-station="fusion"] #shards{display:block}
body[data-station="fusion"] #phrases{display:none}
/* 303: the acid line types the two lines. Each note carries a letter on its peak; when it sounds, the letter drops into the readout */
#typed{position:fixed;inset:0;z-index:1;pointer-events:none;display:none;overflow:hidden;font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;text-transform:uppercase}
body[data-station="303"] #typed{display:block}
body[data-station="303"] #phrases{display:none}
#tyrows{position:absolute;left:16px;right:16px;top:76%;text-align:center;font-size:clamp(14px,2.3vw,24px);letter-spacing:.22em;line-height:1.55;transition:opacity 3s ease;text-shadow:0 0 6px #000,0 0 2px #000}
#tyrows.gone{opacity:0}
#tyrows span{opacity:0;transition:color .6s ease}
#tyrows span.on{opacity:1}
.tyl{position:absolute;left:0;top:0;font-weight:700;white-space:pre;line-height:1;text-shadow:0 0 5px #000;will-change:transform,opacity}
#shardring{position:absolute;left:50%;top:50%;width:0;height:0}
#shardpulse{position:absolute;left:0;top:0;width:0;height:0}
.shard{position:absolute;left:0;top:0;font-family:var(--face);line-height:1;padding:.14em .2em .1em;white-space:pre;filter:drop-shadow(0 0 1.2px rgba(0,0,0,.85));opacity:0;transition:opacity .18s ease,transform .25s cubic-bezier(.2,1.6,.4,1)}
@media (prefers-reduced-motion: reduce){#play{transition:none}}
</style>
</head>
<body>
<canvas id="gl" aria-hidden="true"></canvas>
<canvas id="fx" aria-hidden="true"></canvas>
<div id="shards" aria-hidden="true"><div id="shardring"><div id="shardpulse"></div></div></div>
<div id="typed" aria-hidden="true"><div id="tyrows"><div></div><div></div></div></div>
<svg id="phrases" aria-hidden="true"><defs><path id="wv0" d="M0 0"/><path id="wv1" d="M0 0"/></defs><g id="phg"><text id="ph0"><textPath href="#wv0" id="phtp0"></textPath></text><text id="ph1"><textPath href="#wv1" id="phtp1"></textPath></text></g><text id="phm" opacity="0"></text></svg>

<div class="top">
  <h1 id="title">Crambe Repetita Radio</h1>
  <div class="tuner"><button type="button" class="arrow" id="tunePrev" aria-label="Previous station">‹</button><div class="dial" id="dial"><nav class="stations" id="stations" aria-label="Station"><button type="button" data-s="classical">Classical</button><button type="button" data-s="ambient">Ambient</button><button type="button" data-s="newage">New Age</button><button type="button" data-s="berlin">Berlin School</button><button type="button" data-s="woodblock">Woodblock</button><button type="button" data-s="fusion">Fusion</button><button type="button" data-s="soundtrack">Soundtrack</button><button type="button" data-s="idm">IDM</button><button type="button" data-s="dub">Dub</button><button type="button" data-s="303">303</button><button type="button" data-s="electro">Electro</button><button type="button" data-s="italo">Italo</button></nav></div><button type="button" class="arrow" id="tuneNext" aria-label="Next station">›</button></div>
  <p class="now" id="now" aria-live="polite">Tuning in…</p>
  <a class="how" id="how" href="how.html#ambient" target="_blank" rel="noopener">how this works</a>
</div>

<button id="play" aria-label="Play" data-state="off">
  <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4.5v15l12.5-7.5z"/></svg>
</button>
<p class="status" id="status" role="status" hidden></p>


<div class="bottom">
  <a class="toggle active" id="mode" href="https://toddlburns.com/" aria-label="Switch to the serious site, toddlburns.com">
    <span class="toggle-label-left">Serious</span>
    <span class="toggle-track"><span class="knob"></span></span>
    <span class="toggle-label-right">Fun</span>
  </a>
</div>

<script>
(function(){
'use strict';
var $=function(id){ return document.getElementById(id); };
function clamp(v,a,b){ return Math.max(a,Math.min(b,v)); }
function hash(s){ var h=5381; for(var i=0;i<s.length;i++) h=((h<<5)+h+s.charCodeAt(i))>>>0; return h; }
function fmt(t){ t=Math.max(0,Math.floor(t)); var h=Math.floor(t/3600), m=Math.floor(t%3600/60), s=t%60; return (h?h+':'+(m<10?'0':''):'')+m+':'+(s<10?'0':'')+s; }

/* ================= the station: every review, in the order written, each as long as its album ================= */
var ST=null, N=0, START=[], TOTAL=0, EPOCH=0;
function stationNow(){ return (((Date.now()/1000-EPOCH)%TOTAL)+TOTAL)%TOTAL; }
function reviewAt(p){ var lo=0, hi=N-1; while(lo<hi){ var m=(lo+hi+1)>>1; if(START[m]<=p) lo=m; else hi=m-1; } return lo; }

/* ================= reading a review: the rules ================= */
var MODES={A:[0,2,4,6,7,9,11],B:[0,2,4,5,7,9,10],C:[0,2,3,5,7,9,10],D:[0,2,3,5,7,8,10],F:[0,1,3,5,7,8,10]};   /* the grade letter alone: used by gradeLetter() */
/* 2026-10-11 (tuning desk, Todd): plus and minus count. 15 grades -> scale. Pentatonics have five notes, so degree maths uses the scale's own length. */
var SCALES={Lydian:[0,2,4,6,7,9,11],Ionian:[0,2,4,5,7,9,11],Mixolydian:[0,2,4,5,7,9,10],Dorian:[0,2,3,5,7,9,10],Aeolian:[0,2,3,5,7,8,10],
  Phrygian:[0,1,3,5,7,8,10],'Harmonic minor':[0,2,3,5,7,8,11],'Major pentatonic':[0,2,4,7,9],'Minor pentatonic':[0,3,5,7,10],'Whole tone':[0,2,4,6,8,10]};
var GRADE15={'A+':'Lydian','A':'Lydian','A-':'Ionian','B+':'Ionian','B':'Mixolydian','B-':'Major pentatonic','C+':'Dorian','C':'Minor pentatonic',
  'C-':'Aeolian','D+':'Aeolian','D':'Harmonic minor','D-':'Phrygian','F+':'Phrygian','F':'Phrygian','F-':'Whole tone'};
function scaleFor(g){ var m=(g||'C').split('/')[0].trim().toUpperCase().match(/^[ABCDF][+-]?/); return SCALES[GRADE15[m?m[0]:'C']||'Dorian']; }
var LETTER_PC={C:0,D:2,E:4,F:5,G:7,A:9,B:11};
var LET={a:['ah','ae','aw'],e:['eh','ee'],i:['ih','ee'],o:['oh','aw'],u:['oo','uh'],y:['ee'],r:['er']};
var RE=/([A-Za-z0-9\u00C0-\u024F]+(?:[\u2019'][A-Za-z]+)*)|([.,!?;:])|([-\u2013\u2014])|(\*)|([\u201C\u201D"])/g;   /* groups 4-5 (group 4 never matches now; group 5 = quotes) mark words for the beat stations only */
function gradeLetter(g){ var c=(g||'C').trim().charAt(0).toUpperCase(); return MODES[c]?c:'C'; }
function warmth(g){ var b={A:1,B:.75,C:.5,D:.25,F:0}[gradeLetter(g)]; g=(g||'').split('/')[0]; return clamp(b+(/\+/.test(g)?.07:/-/.test(g)?-.07:0),0,1); }
var cache={};
function prep(ri){
  if(cache[ri]) return cache[ri];
  var R=ST[ri], mode=scaleFor(R.g), NS=mode.length, first=(R.a.replace(/^the\s+/i,'').charAt(0)||'C').toUpperCase();
  var root=(first in LETTER_PC)?LETTER_PC[first]:hash(R.a)%12, words=[], sum=0;
  R.x.split(/\n\n/).forEach(function(par,p){
    var m, last=null, ital=false, quo=false, pl='', itf=[]; RE.lastIndex=0;
    for(var ci=0;ci<par.length;ci++){ if(par[ci]==='*') ital=!ital; else { pl+=par[ci]; itf.push(ital); } }   /* asterisks out first, as before; remember which letters were italic */
    while((m=RE.exec(pl))){
      ital=itf[m.index]; if(m[5]){ quo=m[0]==='\u201C'?true:m[0]==='\u201D'?false:!quo; continue; }
      if(m[1]){ last={key:m[1].toLowerCase().replace(/\u2019/g,"'"),text:m[1],para:p,gap:0,dash:false,it:ital,q:quo}; words.push(last); }
      else if(last){ var ch=m[0]; if(m[3]) last.dash=true; else if(ch===','||ch===';'||ch===':') last.gap+=.5; else { last.gap+=1.6; last.stop=true; if(ch==='?') last.ask=true; if(ch==='!') last.excl=true; } }
    }
    if(last){ last.gap+=4; last.stop=true; }
  });
  words.forEach(function(w){ w.wt=1+.18*Math.min(w.key.length,12)+(w.dash?.5:0); sum+=w.wt+w.gap; });
  var unit=R.s/Math.max(1,sum), t=0;
  words.forEach(function(w,i){
    w.start=t; w.dur=w.wt*unit; t+=(w.wt+w.gap)*unit;
    w.L=clamp((w.dur+w.gap*unit)*2.6,5,30);
    var base=48+(root+5*w.para)%12, d=hash(w.key)%NS, steps=[d,d+2,d+4].concat(w.key.length>5?[d+NS]:[]);   /* long words double the root an octave up */
    if(w.ask) steps.push(d+NS+1);                   /* a question leaves a note hanging */
    w.notes=steps.map(function(s){ return base+12*Math.floor(s/NS)+mode[s%NS]; });
    w.layer=[0,12,-12][w.para%3];                  /* each paragraph changes the layering: none, an octave up, an octave down */
    var cols=[]; for(var c=0;c<w.key.length;c++){ (LET[w.key[c]]||[]).forEach(function(v){ if(BYV[v]) cols.push(v); }); }
    w.cols=cols.length?cols:['uh']; w.closed=/[mn]/.test(w.key); w.h=hash(w.key); w.i=i;
  });
  /* sentences: a phrase with a shape, and a hum underneath */
  var sents=[], s0=0;
  words.forEach(function(w,i){ if(w.stop||i===words.length-1){ sents.push({a:s0,b:i}); s0=i+1; } });
  sents.forEach(function(S,k){ for(var i=S.a;i<=S.b;i++){ var w=words[i]; w.sent=k; w.arc=S.b>S.a?(i-S.a)/(S.b-S.a):.5; }
    var a=words[S.a], b=words[S.b]; S.root=a.notes[0]; S.t=a.start; S.dur=b.start+b.dur-a.start; a.sfirst=S; });
  /* the review's own setting: room from the album's year, texture from the review, brightness from the grade, pulse from its pace */
  var room=clamp((R.y-1999)/7,0,1), wpm=words.length/Math.max(1,R.s/60);
  var set={fam:['breath','shimmer','low','pulse'][ri%4], decay:.8+4.5*room, wet:.5+.45*room,
           cut:1100+2900*warmth(R.g), prate:clamp(wpm/40,.08,.3)};
  return (cache[ri]={words:words, warm:warmth(R.g), set:set, sents:sents});
}

/* ================= the sound: Todd's own vowels, held in grains ================= */
var MASTER=.74;   /* 2026-10-11: was .9; trimmed 1.7 dB because the denser grains, shimmer and hum made it louder */
var VOW=null, BYV={}, SPRITE=null, G=.12, IDX=null, IDB=null, STING=null;
function makeEngine(ctx){
  var hp=ctx.createBiquadFilter(); hp.type='highpass'; hp.frequency.value=120; hp.Q.value=.6;
  var comp=ctx.createDynamicsCompressor(); comp.threshold.value=-18; comp.ratio.value=3; comp.attack.value=.05; comp.release.value=.8;
  var master=ctx.createGain(); master.gain.value=0;
  var dry=ctx.createGain(); dry.gain.value=.5;
  var verb=ctx.createConvolver(), wet=ctx.createGain(); wet.gain.value=.85;
  (function(){ var n=Math.floor(ctx.sampleRate*5), b=ctx.createBuffer(2,n,ctx.sampleRate);
    for(var c=0;c<2;c++){ var d=b.getChannelData(c); for(var i=0;i<n;i++) d[i]=(Math.random()*2-1)*Math.exp(-i/(ctx.sampleRate*1.3)); }
    verb.buffer=b; })();
  var duck=ctx.createGain();
  verb.connect(wet); wet.connect(comp); comp.connect(duck); duck.connect(master);
  var lim=ctx.createDynamicsCompressor(); lim.threshold.value=-4; lim.knee.value=2; lim.ratio.value=20; lim.attack.value=.002; lim.release.value=.25; master.connect(lim); lim.connect(ctx.destination);
  var analyser=ctx.createAnalyser(); analyser.fftSize=1024; lim.connect(analyser);
  /* Todd's announcer voice: never ducked, a touch of the same hall, barely above the music */
  var vg=ctx.createGain(); vg.gain.value=.9; var vs=ctx.createGain(); vs.gain.value=.1;
  vg.connect(ctx.destination); vg.connect(analyser); vg.connect(vs); vs.connect(verb);
  var grains={}, voices=[], bus=null, seed=1, spoken=[], rooms={};
  function rnd(){ seed=(seed*1103515245+12345)>>>0; return (seed>>>8)/16777216; }
  function newBus(){ bus=ctx.createGain(); bus.connect(comp); voices=[]; rooms={}; }
  /* each review plays in its own room: its own reverb, its own texture */
  function room(key,set,until){
    if(rooms[key]) return rooms[key];
    var inp=ctx.createGain(), h=ctx.createBiquadFilter(); h.type='highpass'; h.frequency.value=120; h.Q.value=.6;
    var d=ctx.createGain(); d.gain.value=.5; var c=ctx.createConvolver(), w=ctx.createGain(); w.gain.value=set.wet*1.2;
    var n=Math.floor(ctx.sampleRate*set.decay*2.2), b=ctx.createBuffer(2,n,ctx.sampleRate);
    for(var ch=0;ch<2;ch++){ var x=b.getChannelData(ch); for(var i=0;i<n;i++) x[i]=(Math.random()*2-1)*Math.exp(-i/(ctx.sampleRate*set.decay*.45)); }
    c.buffer=b; c.normalize=true;
    var head=inp;
    if(set.fam==='pulse'){                                  /* slow breathing pulses, at the review's own pace */
      var pg=ctx.createGain(); pg.gain.value=.55; var lfo=ctx.createOscillator(); lfo.frequency.value=set.prate; var lg=ctx.createGain(); lg.gain.value=.45;
      lfo.connect(lg); lg.connect(pg.gain); lfo.start(); lfo.stop(until+40); inp.connect(pg); head=pg;
    }
    head.connect(h); h.connect(d); h.connect(c); c.connect(w); d.connect(bus); w.connect(bus);
    return (rooms[key]=inp);
  }
  function grain(vi,k,G){
    var key=vi*4+k+'_'+G; if(grains[key]) return grains[key];
    var v=VOW[vi], sr=SPRITE.sampleRate, d=SPRITE.getChannelData(0), n=Math.round(G*sr);
    var lo=v.o+v.n*.3, hi=v.o+v.n*.7-G, at=hi>lo ? lo+(hi-lo)*k/3 : v.o+v.n/2-G/2;
    var b=ctx.createBuffer(1,n,sr), o=b.getChannelData(0), a=Math.max(0,Math.round(at*sr));
    for(var i=0;i<n;i++) o[i]=(d[a+i]||0)*(.5-.5*Math.cos(2*Math.PI*i/(n-1)));

        var w=ws[cur.wi], gs=cur.base+w.start; if(gs>HP) break; var t0=gs-at; if(t0+w.L>0) e.word(w,t0,cur.ri,cur.base,cur.base+ST[cur.ri].s-at); cur.wi++; }
      e.grainsUntil(H); eng=save; cur=saved;
      return oc.startRendering();
    });
  },
  renderBeat:function(kind,at,secs){
    var oc=new OfflineAudioContext(2,Math.floor(44100*secs),44100), e=makeEngine(oc);
    return Promise.all([loadSound(oc), kind==='classical'?loadClassical():(kind==='electro'||kind==='italo')?loadVox():0]).then(function(){ beatCache={}; e.master.gain.value=MASTER; var b=makeBeat(oc,e.comp,kind,0,at,null); for(var hz=4;hz<secs+4;hz+=4) b.until(Math.min(secs,hz)); return oc.startRendering(); });
  },
  factIn:function(){ var P=stationNow(), ri=reviewAt(P); return factFor(ri,START[ri]).at-P; },
  factsScheduled:function(){ return Object.keys(factsDone).length; },
  stingAt:function(){ return stingAt&&ctx ? stingAt-ctx.currentTime : null; },
  now:function(){ var P=stationNow(), ri=reviewAt(P); return {review:ST[ri], into:P-START[ri], total:TOTAL}; }
};
})();
</script>
