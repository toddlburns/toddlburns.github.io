<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Todd L. Burns's Stylus Magazine record reviews, turned into music on three stations: ambient in his own voice, 303 acid, and jazz fusion. Each piece lasts exactly as long as the album it reviewed.">
<title>Crambe Repetita Radio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sacramento&display=swap">
<style>
*{box-sizing:border-box}
body{margin:0}
[hidden]{display:none!important}
/* Layout: one full-bleed field of light the music paints; quiet fixed type in Times New Roman (as the Crambe Repetita Museum); the station name rides the top; a point of light at the centre; Todd's Serious/Fun switch at the foot. Single dark world by choice. */
:root{
  --ink:#05070B; --fg:#EEF0F4; --dim:rgba(238,240,244,.62); --faint:rgba(238,240,244,.38); --line:rgba(238,240,244,.2);
  --on:#34C759; --track:rgba(238,240,244,.28);
  --face:"Times New Roman",Times,serif;
  --site:Georgia,"Times New Roman",serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--ink);color:var(--fg);overflow:hidden;font-family:var(--face)}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block}
.top{position:fixed;left:0;right:0;top:0;z-index:2;padding-inline:16px;padding-top:calc(env(safe-area-inset-top,0px) + 22px);display:flex;flex-direction:column;align-items:center;gap:12px;pointer-events:none}
h1{font-family:var(--face);font-weight:400;font-size:clamp(1.15rem,3.2vw,2.4rem);line-height:1;letter-spacing:.01em;margin:0;white-space:nowrap}
.now{margin:0;font-family:var(--face);font-size:.85rem;letter-spacing:.02em;color:var(--dim);text-align:center;max-width:40rem;line-height:1.6;font-variant-numeric:tabular-nums;transition:opacity 1.6s ease}
.now .np-time{font-size:.75rem;color:var(--faint)}
.now .np-word{font-size:.8rem;color:var(--dim)}
.now .np-label{font-size:.7rem;letter-spacing:.14em;color:var(--faint)}
.now .np-the{font-size:1.05rem;font-style:italic;color:var(--fg)}

body.quiet .now,body.quiet .stations{opacity:0}
/* the three stations: same review, same moment, three ways of playing it */
.stations{display:flex;gap:18px;pointer-events:auto;transition:opacity 1.6s ease}
.stations button{border:0;background:transparent;color:var(--faint);font-family:var(--face);font-size:.7rem;letter-spacing:.14em;text-transform:uppercase;padding:6px 2px;cursor:pointer;border-bottom:1px solid transparent}
.stations button:hover{color:var(--dim)}
.stations button[aria-pressed="true"]{color:var(--fg);border-bottom-color:var(--line)}
/* Play / Pause: just the symbol, floating on the light */
#play{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:2;border:0;background:transparent;color:var(--fg);cursor:pointer;padding:24px;display:grid;place-items:center;transition:opacity .6s}
#play svg{width:clamp(40px,6vw,56px);height:clamp(40px,6vw,56px);fill:currentColor;filter:drop-shadow(0 0 18px rgba(0,0,0,.25))}
#play[data-state="on"]{opacity:.3}
#play:hover,#play:focus-visible{opacity:1}
#play[aria-busy="true"]{opacity:.5}
.status{position:fixed;left:16px;right:16px;top:calc(50% + 70px);text-align:center;font-size:.7rem;letter-spacing:.08em;color:var(--dim);margin:0;z-index:2}
/* Serious/Fun: the same switch as toddlburns.com */
.bottom{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 24px);z-index:2}
.toggle{display:flex;align-items:center;gap:8px;cursor:pointer;user-select:none;font-family:var(--site);font-size:12px;letter-spacing:1px;color:var(--faint);text-decoration:none}
.toggle-track{width:36px;height:18px;background:var(--track);border-radius:9px;position:relative;transition:background .3s}
.toggle-track .knob{width:14px;height:14px;background:#fff;border-radius:50%;position:absolute;top:2px;left:2px;transition:left .3s}
.toggle.active .toggle-track{background:var(--on)}
.toggle.active .knob{left:20px}
.toggle-label-left,.toggle-label-right{transition:color .3s}
.toggle .toggle-label-left{color:var(--fg)}
.toggle .toggle-label-right{color:var(--faint)}
.toggle.active .toggle-label-left{color:var(--faint)}
.toggle.active .toggle-label-right{background:linear-gradient(90deg,#ff0000,#ff8800,#ffdd00,#00cc00,#0066ff,#8800ff);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
:focus-visible{outline:2px solid var(--fg);outline-offset:3px}
/* two lines in a hand-written cursive, written letter by letter onto a line that waves like the light */
#phrases{position:fixed;inset:0;width:100%;height:100%;z-index:1;pointer-events:none;mix-blend-mode:soft-light}
#phrases text{font-family:"Sacramento","Snell Roundhand","Apple Chancery",cursive;font-size:clamp(1.7rem,3.4vw,2.9rem);fill:#fff}
/* Fusion: the two lines as cut-out paper shards in two rings, turning with the kaleidoscope */
#shards{position:fixed;inset:0;z-index:1;pointer-events:none;display:none;overflow:hidden}
body[data-station="fusion"] #shards{display:block}
body[data-station="fusion"] #phrases{display:none}
#shardring{position:absolute;left:50%;top:50%;width:0;height:0}
#shardpulse{position:absolute;left:0;top:0;width:0;height:0}
.shard{position:absolute;left:0;top:0;font-family:var(--face);line-height:1;padding:.14em .2em .1em;white-space:pre;filter:drop-shadow(0 0 1.2px rgba(0,0,0,.85));opacity:0;transition:opacity .18s ease,transform .25s cubic-bezier(.2,1.6,.4,1)}
@media (prefers-reduced-motion: reduce){#play{transition:none}}
</style>
</head>
<body>
<canvas id="gl" aria-hidden="true"></canvas>
<div id="shards" aria-hidden="true"><div id="shardring"><div id="shardpulse"></div></div></div>
<svg id="phrases" aria-hidden="true"><defs><path id="wv0" d="M0 0"/><path id="wv1" d="M0 0"/></defs><g id="phg"><text id="ph0"><textPath href="#wv0" id="phtp0"></textPath></text><text id="ph1"><textPath href="#wv1" id="phtp1"></textPath></text></g><text id="phm" opacity="0"></text></svg>

<div class="top">
  <h1 id="title">Crambe Repetita Radio</h1>
  <nav class="stations" id="stations" aria-label="Station"><button type="button" data-s="ambient">Ambient</button><button type="button" data-s="303">303</button><button type="button" data-s="fusion">Fusion</button></nav>
  <p class="now" id="now" aria-live="polite">Tuning in…</p>
</div>

<button id="play" aria-label="Play" data-state="off">
  <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4.5v15l12.5-7.5z"/></svg>
</button>
<p class="status" id="status" role="status" hidden></p>


<div class="bottom">
  <a class="toggle active" id="mode" href="https://toddlburns.com/" aria-label="Switch to the serious site, toddlburns.com">
    <span class="toggle-label-left">Serious</span>
    <span class="toggle-track"><span class="knob"></span></span>
    <span class="toggle-label-right">Fun</span>
  </a>
</div>

<script>
(function(){
'use strict';
var $=function(id){ return document.getElementById(id); };
function clamp(v,a,b){ return Math.max(a,Math.min(b,v)); }
function hash(s){ var h=5381; for(var i=0;i<s.length;i++) h=((h<<5)+h+s.charCodeAt(i))>>>0; return h; }
function fmt(t){ t=Math.max(0,Math.floor(t)); var h=Math.floor(t/3600), m=Math.floor(t%3600/60), s=t%60; return (h?h+':'+(m<10?'0':''):'')+m+':'+(s<10?'0':'')+s; }

/* ================= the station: every review, in the order written, each as long as its album ================= */
var ST=null, N=0, START=[], TOTAL=0, EPOCH=0;
function stationNow(){ return (((Date.now()/1000-EPOCH)%TOTAL)+TOTAL)%TOTAL; }
function reviewAt(p){ var lo=0, hi=N-1; while(lo<hi){ var m=(lo+hi+1)>>1; if(START[m]<=p) lo=m; else hi=m-1; } return lo; }

/* ================= reading a review: the rules ================= */
var MODES={A:[0,2,4,6,7,9,11],B:[0,2,4,5,7,9,10],C:[0,2,3,5,7,9,10],D:[0,2,3,5,7,8,10],F:[0,1,3,5,7,8,10]};   /* the grade letter alone: used by gradeLetter() */
/* 2026-10-11 (tuning desk, Todd): plus and minus count. 15 grades -> scale. Pentatonics have five notes, so degree maths uses the scale's own length. */
var SCALES={Lydian:[0,2,4,6,7,9,11],Ionian:[0,2,4,5,7,9,11],Mixolydian:[0,2,4,5,7,9,10],Dorian:[0,2,3,5,7,9,10],Aeolian:[0,2,3,5,7,8,10],
  Phrygian:[0,1,3,5,7,8,10],'Harmonic minor':[0,2,3,5,7,8,11],'Major pentatonic':[0,2,4,7,9],'Minor pentatonic':[0,3,5,7,10],'Whole tone':[0,2,4,6,8,10]};
var GRADE15={'A+':'Lydian','A':'Lydian','A-':'Ionian','B+':'Ionian','B':'Mixolydian','B-':'Major pentatonic','C+':'Dorian','C':'Minor pentatonic',
  'C-':'Aeolian','D+':'Aeolian','D':'Harmonic minor','D-':'Phrygian','F+':'Phrygian','F':'Phrygian','F-':'Whole tone'};
function scaleFor(g){ var m=(g||'C').split('/')[0].trim().toUpperCase().match(/^[ABCDF][+-]?/); return SCALES[GRADE15[m?m[0]:'C']||'Dorian']; }
var LETTER_PC={C:0,D:2,E:4,F:5,G:7,A:9,B:11};
var LET={a:['ah','ae','aw'],e:['eh','ee'],i:['ih','ee'],o:['oh','aw'],u:['oo','uh'],y:['ee'],r:['er']};
var RE=/([A-Za-z0-9\u00C0-\u024F]+(?:[\u2019'][A-Za-z]+)*)|([.,!?;:])|([-\u2013\u2014])/g;
function gradeLetter(g){ var c=(g||'C').trim().charAt(0).toUpperCase(); return MODES[c]?c:'C'; }
function warmth(g){ var b={A:1,B:.75,C:.5,D:.25,F:0}[gradeLetter(g)]; g=(g||'').split('/')[0]; return clamp(b+(/\+/.test(g)?.07:/-/.test(g)?-.07:0),0,1); }
var cache={};
function prep(ri){
  if(cache[ri]) return cache[ri];
  var R=ST[ri], mode=scaleFor(R.g), NS=mode.length, first=(R.a.replace(/^the\s+/i,'').charAt(0)||'C').toUpperCase();
  var root=(first in LETTER_PC)?LETTER_PC[first]:hash(R.a)%12, words=[], sum=0;
  R.x.split(/\n\n/).forEach(function(par,p){
    var m, last=null; RE.lastIndex=0;
    while((m=RE.exec(par.replace(/\*/g,'')))){
      if(m[1]){ last={key:m[1].toLowerCase().replace(/\u2019/g,"'"),text:m[1],para:p,gap:0,dash:false}; words.push(last); }
      else if(last){ var ch=m[0]; if(m[3]) last.dash=true; else if(ch===','||ch===';'||ch===':') last.gap+=.5; else { last.gap+=1.6; last.stop=true; if(ch==='?') last.ask=true; } }
    }
    if(last){ last.gap+=4; last.stop=true; }
  });
  words.forEach(function(w){ w.wt=1+.18*Math.min(w.key.length,12)+(w.dash?.5:0); sum+=w.wt+w.gap; });
  var unit=R.s/Math.max(1,sum), t=0;
  words.forEach(function(w,i){
    w.start=t; w.dur=w.wt*unit; t+=(w.wt+w.gap)*unit;
    w.L=clamp((w.dur+w.gap*unit)*2.6,5,30);
    var base=48+(root+5*w.para)%12, d=hash(w.key)%NS, steps=[d,d+2,d+4].concat(w.key.length>5?[d+NS]:[]);   /* long words double the root an octave up */
    if(w.ask) steps.push(d+NS+1);                   /* a question leaves a note hanging */
    w.notes=steps.map(function(s){ return base+12*Math.floor(s/NS)+mode[s%NS]; });
    w.layer=[0,12,-12][w.para%3];                  /* each paragraph changes the layering: none, an octave up, an octave down */
    var cols=[]; for(var c=0;c<w.key.length;c++){ (LET[w.key[c]]||[]).forEach(function(v){ if(BYV[v]) cols.push(v); }); }
    w.cols=cols.length?cols:['uh']; w.closed=/[mn]/.test(w.key); w.h=hash(w.key); w.i=i;
  });
  /* sentences: a phrase with a shape, and a hum underneath */
  var sents=[], s0=0;
  words.forEach(function(w,i){ if(w.stop||i===words.length-1){ sents.push({a:s0,b:i}); s0=i+1; } });
  sents.forEach(function(S,k){ for(var i=S.a;i<=S.b;i++){ var w=words[i]; w.sent=k; w.arc=S.b>S.a?(i-S.a)/(S.b-S.a):.5; }
    var a=words[S.a], b=words[S.b]; S.root=a.notes[0]; S.t=a.start; S.dur=b.start+b.dur-a.start; a.sfirst=S; });
  /* the review's own setting: room from the album's year, texture from the review, brightness from the grade, pulse from its pace */
  var room=clamp((R.y-1999)/7,0,1), wpm=words.length/Math.max(1,R.s/60);
  var set={fam:['breath','shimmer','low','pulse'][ri%4], decay:.8+4.5*room, wet:.5+.45*room,
           cut:1100+2900*warmth(R.g), prate:clamp(wpm/40,.08,.3)};
  return (cache[ri]={words:words, warm:warmth(R.g), set:set, sents:sents});
}

/* ================= the sound: Todd's own vowels, held in grains ================= */
var MASTER=.74;   /* 2026-10-11: was .9; trimmed 1.7 dB because the denser grains, shimmer and hum made it louder */
var VOW=null, BYV={}, SPRITE=null, G=.12, IDX=null, IDB=null, STING=null;
function makeEngine(ctx){
  var hp=ctx.createBiquadFilter(); hp.type='highpass'; hp.frequency.value=120; hp.Q.value=.6;
  var comp=ctx.createDynamicsCompressor(); comp.threshold.value=-18; comp.ratio.value=3; comp.attack.value=.05; comp.release.value=.8;
  var master=ctx.createGain(); master.gain.value=0;
  var dry=ctx.createGain(); dry.gain.value=.5;
  var verb=ctx.createConvolver(), wet=ctx.createGain(); wet.gain.value=.85;
  (function(){ var n=Math.floor(ctx.sampleRate*5), b=ctx.createBuffer(2,n,ctx.sampleRate);
    for(var c=0;c<2;c++){ var d=b.getChannelData(c); for(var i=0;i<n;i++) d[i]=(Math.random()*2-1)*Math.exp(-i/(ctx.sampleRate*1.3)); }
    verb.buffer=b; })();
  var duck=ctx.createGain();
  verb.connect(wet); wet.connect(comp); comp.connect(duck); duck.connect(master);
  var lim=ctx.createDynamicsCompressor(); lim.threshold.value=-4; lim.knee.value=2; lim.ratio.value=20; lim.attack.value=.002; lim.release.value=.25; master.connect(lim); lim.connect(ctx.destination);
  var analyser=ctx.createAnalyser(); analyser.fftSize=1024; lim.connect(analyser);
  /* Todd's announcer voice: never ducked, a touch of the same hall, barely above the music */
  var vg=ctx.createGain(); vg.gain.value=.9; var vs=ctx.createGain(); vs.gain.value=.1;
  vg.connect(ctx.destination); vg.connect(analyser); vg.connect(vs); vs.connect(verb);
  var grains={}, voices=[], bus=null, seed=1, spoken=[], rooms={};
  function rnd(){ seed=(seed*1103515245+12345)>>>0; return (seed>>>8)/16777216; }
  function newBus(){ bus=ctx.createGain(); bus.connect(comp); voices=[]; rooms={}; }
  /* each review plays in its own room: its own reverb, its own texture */
  function room(key,set,until){
    if(rooms[key]) return rooms[key];
    var inp=ctx.createGain(), h=ctx.createBiquadFilter(); h.type='highpass'; h.frequency.value=120; h.Q.value=.6;
    var d=ctx.createGain(); d.gain.value=.5; var c=ctx.createConvolver(), w=ctx.createGain(); w.gain.value=set.wet*1.2;
    var n=Math.floor(ctx.sampleRate*set.decay*2.2), b=ctx.createBuffer(2,n,ctx.sampleRate);
    for(var ch=0;ch<2;ch++){ var x=b.getChannelData(ch); for(var i=0;i<n;i++) x[i]=(Math.random()*2-1)*Math.exp(-i/(ctx.sampleRate*set.decay*.45)); }
    c.buffer=b; c.normalize=true;
    var head=inp;
    if(set.fam==='pulse'){                                  /* slow breathing pulses, at the review's own pace */
      var pg=ctx.createGain(); pg.gain.value=.55; var lfo=ctx.createOscillator(); lfo.frequency.value=set.prate; var lg=ctx.createGain(); lg.gain.value=.45;
      lfo.connect(lg); lg.connect(pg.gain); lfo.start(); lfo.stop(until+40); inp.connect(pg); head=pg;
    }
    head.connect(h); h.connect(d); h.connect(c); c.connect(w); d.connect(bus); w.connect(bus);
    return (rooms[key]=inp);
  }
  function grain(vi,k,G){
    var key=vi*4+k+'_'+G; if(grains[key]) return grains[key];
    var v=VOW[vi], sr=SPRITE.sampleRate, d=SPRITE.getChannelData(0), n=Math.round(G*sr);
    var lo=v.o+v.n*.3, hi=v.o+v.n*.7-G, at=hi>lo ? lo+(hi-lo)*k/3 : v.o+v.n/2-G/2;
    var b=ctx.createBuffer(1,n,sr), o=b.getChannelData(0), a=Math.max(0,Math.round(at*sr));
    for(var i=0;i<n;i++) o[i]=(d[a+i]||0)*(.5-.5*Math.cos(2*Math.PI*i/(n-1)));
    return (grains[key]=b);
  }
  function curve(level,x0){ var c=new Float32Array(48); for(var i=0;i<48;i++){ var x=Math.min(1,x0+(1-x0)*i/47); c[i]=level*Math.pow(Math.max(0,Math.sin(Math.PI*x)),1.5)+1e-5;   /* rounding can push x past 1 */ } return c; }
  /* one held note: a vowel of Todd's, tuned to the chord, as a stream of overlapping grains */
  function voice(vi,midi,pan,t0,L,closed,level,o){
    var now=ctx.currentTime+.03, from=Math.max(t0,now); if(t0+L<=from+.05) return;
    var f=440*Math.pow(2,(midi-69)/12), rate=f/VOW[vi].f; while(rate>o.hi) rate/=2; while(rate<o.lo) rate*=2;
    var g=ctx.createGain(); g.gain.value=0;
    g.gain.setValueCurveAtTime(curve(level,(from-t0)/L),from,t0+L-from);
    var lp=ctx.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=closed?500:o.cut; lp.Q.value=.5; g.connect(lp);
    var out=lp; if(closed){ var bo=ctx.createGain(); bo.gain.value=2.2; lp.connect(bo); out=bo; }
    var p=ctx.createStereoPanner?ctx.createStereoPanner():null; if(p){ p.pan.value=pan; out.connect(p); p.connect(o.dest); } else out.connect(o.dest);
    voices.push({vi:vi,rate:rate,g:g,t:from,end:t0+L,G:o.G,hop:o.G/rate/o.ov});
  }
  /* 2026-10-11 tuning-desk settings (Todd's preset): grains overlap twice as densely, an octave shimmer on every texture, a louder sentence hum (was .5) */
  var DENS=2, SHIMMER=.5, HUM=1.35;
  var FAM={breath:{G:.22,ov:2,lo:.7,hi:1.6,cut:.6,shift:0}, shimmer:{G:.12,ov:3,lo:.7,hi:1.6,cut:1.4,shift:0},
           low:{G:.14,ov:3,lo:.45,hi:1.1,cut:.7,shift:-12}, pulse:{G:.1,ov:3,lo:.7,hi:1.6,cut:1,shift:0}};
  function word(w,t0,ri,key,until){
    var P=prep(ri), set=P.set, F=FAM[set.fam], dest=room(key,set,until);
    var arc=.55+.9*Math.sin(Math.PI*(w.arc==null?.5:w.arc));          /* the tone opens toward the middle of the sentence */
    var o={dest:dest,G:F.G,ov:F.ov*DENS,lo:F.lo,hi:F.hi,cut:set.cut*F.cut*arc};
    var notes=w.notes.slice(0, set.fam==='breath'?3:5), n=notes.length, level=2.1/Math.sqrt(n);
    notes.forEach(function(m,k){
      var col=w.cols[(k+w.i)%w.cols.length], list=BYV[col];
      voice(list[(w.h+k)%list.length], m+F.shift, (k/Math.max(1,n-1))*1.2-.6, t0, w.L, w.closed, level, o);
    });
    var top=notes[n-1]+F.shift, l2=BYV[w.cols[0]];
    voice(l2[(w.h+3)%l2.length], top+12, .3, t0+.4, w.L, false, level*SHIMMER, {dest:dest,G:.1,ov:3*DENS,lo:.9,hi:2.2,cut:9000});   /* every texture now (was shimmer only, at .4) */
    if(w.layer) voice(l2[(w.h+5)%l2.length], top+w.layer, -.3, t0+.2, w.L, false, level*.32, {dest:dest,G:F.G,ov:F.ov*DENS,lo:w.layer>0?.9:.45,hi:w.layer>0?2.2:1.1,cut:o.cut});
    /* the first word of a sentence lays a hum under the whole sentence */
    if(w.sfirst){ var S=w.sfirst, r=S.root; while(r>50) r-=12; while(r<38) r+=12; var hl=BYV.oo||BYV.oh||l2;
      voice(hl[(w.h+7)%hl.length], r, 0, t0, Math.max(6,S.dur+4), true, HUM, {dest:dest,G:.2,ov:2*DENS,lo:.4,hi:1.1,cut:500}); }
  }
  function grainsUntil(H){
    voices=voices.filter(function(v){
      while(v.t<H && v.t<v.end){
        var s=ctx.createBufferSource(); s.buffer=grain(v.vi,Math.floor(rnd()*4),v.G); s.playbackRate.value=v.rate; s.connect(v.g); s.start(v.t);
        v.t+=v.hop*(.85+.3*rnd());
      }
      return v.t<v.end;
    });
  }
  function sting(t){ if(!STING) return 0; var s=ctx.createBufferSource(); s.buffer=STING; var g=ctx.createGain(); g.gain.value=.8; s.connect(g); g.connect(ctx.destination); g.connect(analyser); s.start(t); spoken.push(s); return STING.duration; }
  function speak(name,t){ var c=IDX&&IDX[name]; if(!c) return 0; var s=ctx.createBufferSource(); s.buffer=IDB; s.connect(vg); s.start(t,c[0],c[1]); spoken.push(s); return c[1]; }

  var loop=Math.floor(P/TOTAL)*TOTAL, ri=reviewAt(P-loop), base=loop+START[ri], ws=prep(ri).words, wi=0;
  while(wi<ws.length && base+ws[wi].start+ws[wi].L<P) wi++;

}
function tick(){
  var H=ctx.currentTime+2, HP=posAt(H);
  for(var guard=0;guard<400;guard++){
    var ws=prep(cur.ri).words;
    if(cur.wi>=ws.length){
      var hand=anchorCtx+(cur.base+ST[cur.ri].s-anchorPos);         /* this review hands off to the next */
      if(hand>ctx.currentTime+.2){ if(hand<identUntil+.5) hand=identUntil+.5; ident('sting',hand); stingAt=hand; }
      cur.base+=ST[cur.ri].s; cur.ri=(cur.ri+1)%N; cur.wi=0; continue;
    }
    var w=ws[cur.wi], gs=cur.base+w.start; if(gs>HP) break;
    if(STATION==='ambient') eng.word(w, anchorCtx+(gs-anchorPos), cur.ri, cur.base, anchorCtx+(cur.base+ST[cur.ri].s-anchorPos)); events.push({k:'w', t:anchorCtx+(gs-anchorPos), L:w.L, w:w}); cur.wi++;
  }

  var P0=posAt(ctx.currentTime), loop=Math.floor(P0/TOTAL)*TOTAL, rn=reviewAt(P0-loop), bn=loop+START[rn], F=factFor(rn,bn);
  if(!factsDone[bn] && F.at>P0+.5 && F.at<=HP){ factsDone[bn]=1; var tf=anchorCtx+(F.at-anchorPos); if(tf<identUntil+3) tf=identUntil+3; ident('fact',tf,F.seq); }
  var ms=Date.now(), next=Math.ceil(ms/1800000)*1800000, tB=ctx.currentTime+(next-ms)/1000;
  if(tB<H && next!==lastBoundary){ lastBoundary=next; if(tB>identUntil+20) ident(new Date(next).getMinutes()===0?'top':'half',tB); }
}

      [0x52494646,36+n,0x57415645,0x666d7420].forEach(function(x,i){ if(i===1) v.setUint32(4,x,true); else v.setUint32(i*4,x,false); });
      v.setUint32(16,16,true); v.setUint16(20,1,true); v.setUint16(22,1,true); v.setUint32(24,8000,true); v.setUint32(28,8000,true);
      v.setUint16(32,1,true); v.setUint16(34,8,true); v.setUint32(36,0x64617461,false); v.setUint32(40,n,true);
      for(var i=44;i<b.length;i++) b[i]=128;

/* each sounding word becomes a light in the field */
var buf=new Float32Array(1024), BLV=new Float32Array(NB*4);
function place(w){ var h=w.h>>>0, a=innerWidth/Math.max(1,innerHeight); return {x:((h%997)/997-.5)*a*.7, y:(((h>>>10)%991)/991-.5)*.6}; }
function frame(now){
  var dt=Math.min(.05,(now-last)/1000); last=now; time+=dt*(calm?.35:1);
  temp+=(tempTarget-temp)*Math.min(1,dt*.15);
  var T=playing&&ctx?ctx.currentTime:0, dim=0, rise=0;
  if(playing&&eng){
    eng.analyser.getFloatTimeDomainData(buf); var s=0; for(var i=0;i<buf.length;i++) s+=buf[i]*buf[i];
    energy+=(Math.min(1,Math.sqrt(s/buf.length)*6)-energy)*Math.min(1,dt*1.5);
    for(var e=events.length-1;e>=0;e--){
      var ev=events[e], age=(T-ev.t)/ev.L;
      if(age>1){ events.splice(e,1); continue; }
      if(age<0) continue;
      var env=Math.pow(Math.sin(Math.PI*age),1.5);
      if(ev.k==='voice') dim=Math.max(dim,Math.min(1,Math.min(age*ev.L,(1-age)*ev.L)/.6));
      else if(ev.k==='sting') rise=Math.max(rise,Math.pow(Math.sin(Math.PI*Math.min(1,age*1.15)),1.2));
      else {
        ev.env=env; if(!ev.pos) ev.pos=place(ev.w);
      }
    }
  } else energy*=Math.exp(-dt*.8);
  /* the brightest few sounding words become lights in the field */
  var lw=null; events.forEach(function(ev){ if(ev.k==='w' && T>=ev.t && (!lw || ev.t>lw.t)) lw=ev; }); if(lw && lw.w!==nowWord){ nowWord=lw.w; nowLine(); }
  var ws=events.filter(function(ev){ return ev.k==='w' && ev.env>0 && T>=ev.t; }).sort(function(a,b){ return b.env-a.env; }).slice(0,NB);
  for(var k=0;k<NB;k++){ var ev2=ws[k]; if(ev2){ var p=ev2.pos||place(ev2.w); BLV.set([p.x,p.y,ev2.env,.45+(ev2.w.h%7)/7*.5],k*4); } else BLV.set([9,9,0,0],k*4); }
  if(now-lastLine>500){ lastLine=now; nowLine(); }
  var PR=STATION==='ambient'?null:VP[STATION==='303'?'303'+PIC303:STATION];
  if(PR) drawBeat(PR,T,dim,rise);
  else if(prog){
    gl.useProgram(prog); gl.uniform2f(uni.res,cv.width,cv.height); gl.uniform1f(uni.time,time); gl.uniform1f(uni.temp,temp); gl.uniform1f(uni.energy,energy);
    gl.uniform1f(uni.dim,dim); gl.uniform1f(uni.rise,rise); gl.uniform4fv(uni.bl,BLV);
    gl.viewport(0,0,cv.width,cv.height); gl.drawArrays(gl.TRIANGLES,0,3);
  }
  requestAnimationFrame(frame);
}
var lastLine=0;

/* the beat stations' pictures, fed by what the beat engine scheduled (VIS), applied as each moment arrives */
var FZ_CHORD=null, PIC303='f',   /* Floor chosen 2026-10-13; Scope and Lights shaders kept, unused */ FU=new Float32Array(64), HU=new Float32Array(128), WV=new Float32Array(128);
var PV={hist:[], steps:0, roll:0,pat:[[],[],[],[]], fl:new Float32Array(64).fill(-9), kickT:-9, clapT:-9, step:0, stepT:0, acid:null, acidT:-9, cut:.3,
        beams:[0,1,2,3].map(function(i){ return {r:.1+.1*i, tr:.1+.1*i, a:.13*i, ta:.13*i, h:.5+.15*i, t:-9}; }), rot:0, trot:0, bassT:-9, bassM:40, sparks:[], snT:-9, snV:0};
var LU=new Float32Array(64), BMU=new Float32Array(16), SPU=new Float32Array(32);
function pitchX(m){ return ((m-50)/30-.5)*Math.min(1.6,innerWidth/Math.max(1,innerHeight))*.85; }
function pitchH(m){ return .5+.45*(((m%12)*7)%12)/11; }
function applyVis(e){
  if(e.k==='s'){ PV.step=e.s; PV.stepT=e.t; PV.cut=e.cut;
    e.pats.forEach(function(pt,r){ PV.pat[r]=pt||[]; });
    [e.acid,(e.pats[1]||[])[e.s],(e.pats[2]||[])[e.s],(e.pats[3]||[])[e.s]].forEach(function(h,r){ if(h) PV.fl[r*16+e.s]=e.t; });
    if(e.kick) PV.kickT=e.t; if(e.clap) PV.clapT=e.t; if(e.acid){ PV.acid=e.acid; PV.acidT=e.t; }
    PV.hist.unshift([e.acid?e.acid.n:-1, e.acid&&e.acid.acc?1:0, e.kick?1:0, ((e.pats[3]||[])[e.s]?1:0)+(e.clap?2:0)]); if(PV.hist.length>32) PV.hist.pop(); PV.steps++; }
  else if(e.k==='c'){ if(FZ_CHORD) FZ_CHORD(); e.v.forEach(function(m,i){ var B=PV.beams[i]; B.tr=.07+.42*clamp((m-52)/27,0,1); B.ta=.5236*(((m%12)*7)%12)/11; B.h=pitchH(m); B.t=e.t; }); PV.trot+=.35+.25*((e.v[0]%5)/4); }
  else if(e.k==='b'){ PV.bassT=e.t; PV.bassM=e.m; }
  else if(e.k==='l'){ PV.sparks.push({a:Math.random()*.5236, t:e.t, dur:e.dur, r0:.08+.2*clamp((e.m-60)/30,0,1)}); if(PV.sparks.length>8) PV.sparks.shift(); }
  else if(e.k==='n'){ PV.snT=e.t; PV.snV=e.v; PV.trot+=.03*e.v; }
}
function drawBeat(PR,T,dim,rise){
  var u=PR.u, ex=function(t0,k){ var a=T-t0; return a<0?0:Math.exp(-a/k); };
  while(VIS.length && VIS[0].t<=T) applyVis(VIS.shift());
  gl.useProgram(PR.p); gl.uniform2f(u.res,cv.width,cv.height); gl.uniform1f(u.time,time); gl.uniform1f(u.temp,temp); gl.uniform1f(u.energy,energy);
  gl.uniform1f(u.dim,dim); gl.uniform1f(u.rise,rise);
  if(STATION==='303'){
    HU.fill(0); for(var i=0;i<32;i++){ var h=PV.hist[i]; HU.set(h?h:[-1,0,0,0],i*4); }
    if(eng&&playing){ var z=0; for(var j=1;j<512;j++){ if(buf[j-1]<0&&buf[j]>=0){ z=j; break; } } for(var q=0;q<128;q++) WV[q]=buf[z+q*4]||0; } else WV.fill(0);
    gl.uniform4fv(u.H,HU); gl.uniform1f(u.ph,playing?Math.min(1,(T-PV.stepT)/S16):0); gl.uniform1f(u.sc,PIC303==='f'?PV.steps%8192:PV.steps%64);
    gl.uniform1f(u.kick,ex(PV.kickT,.16)); gl.uniform1f(u.cut,PV.cut); gl.uniform1fv(u.wave,WV);
    var nn=PV.acid?PV.acid.n:.5; PV.roll+=((nn-.5)*.2-PV.roll)*.03; gl.uniform1f(u.roll,PV.roll);
    if(u.F){ FU.fill(0); FU.set(PV.hist[0]||[-1,0,0,0],0); var fk=1; for(var vi=0;vi<VIS.length&&fk<16;vi++){ var ve=VIS[vi]; if(ve.k==='s'){ FU.set([ve.acid?ve.acid.n:-1, ve.acid&&ve.acid.acc?1:0,0,0],fk*4); fk++; } }
      for(;fk<16;fk++) FU.set([-1,0,0,0],fk*4); gl.uniform4fv(u.F,FU); }
  } else {
    var k=1-Math.exp(-(1/60)/.05); PV.rot+=(PV.trot-PV.rot)*(1-Math.exp(-(1/60)/.09));
    PV.beams.forEach(function(B,i){ B.r+=(B.tr-B.r)*k; B.a+=(B.ta-B.a)*k; BMU.set([B.r,B.a,B.h,playing?.35+.65*ex(B.t,.3):.25],i*4); });
    PV.sparks=PV.sparks.filter(function(s){ return T-s.t<s.dur+1.4; });
    for(var j=0;j<8;j++){ var s=PV.sparks[j]; if(s&&T>=s.t){ var a=T-s.t, rr=s.r0+.5*Math.min(1,a/1.4); SPU.set([Math.cos(s.a)*rr,Math.sin(s.a)*rr,Math.exp(-a/(s.dur+.35)),0],j*4); } else SPU.set([9,9,0,0],j*4); }
    gl.uniform4fv(u.bm,BMU); gl.uniform4f(u.bs,pitchH(PV.bassM),.15+.85*ex(PV.bassT,.3),0,0); gl.uniform4fv(u.sp,SPU); gl.uniform1f(u.sn,PV.snV*ex(PV.snT,.15)); gl.uniform1f(u.rot,PV.rot);
  }
  gl.viewport(0,0,cv.width,cv.height); gl.drawArrays(gl.TRIANGLES,0,3);
}

/* both lines, written slowly letter by letter on a moving wave (about 8 s), a short pause, a slow fade to nothing, 15 s of nothing, again */
(function(){
  var LINES=['Cut my reviews into pieces','This is my last retort'], NS='http://www.w3.org/2000/svg';
  var WRITE=8, EASE=.7, HOLD=1.5, FADE=6, REST=15;
  var paths=[$('wv0'),$('wv1')], tps=[$('phtp0'),$('phtp1')], txts=[$('ph0'),$('ph1')], grp=$('phg'), meas=$('phm');
  var calmP=window.matchMedia('(prefers-reduced-motion: reduce)').matches, cur=null;
  function begin(){
    var W=innerWidth, H=innerHeight, lens=LINES.map(function(l){ meas.textContent=l; return meas.getComputedTextLength()*1.08+8; });
    var len=Math.min(Math.max(lens[0],lens[1]),W-40), lh=parseFloat(getComputedStyle(txts[0]).fontSize)*1.15;
    var x=20+(W-40-len)*Math.random(), y=H*(Math.random()<.5 ? .25+.08*Math.random() : .62+.08*Math.random());
    var spans=[];
    LINES.forEach(function(line,j){
      var tp=tps[j]; while(tp.firstChild) tp.removeChild(tp.firstChild);
      line.split('').forEach(function(ch){ var sp=document.createElementNS(NS,'tspan'); sp.textContent=ch; sp.setAttribute('opacity','0'); tp.appendChild(sp); spans.push(sp); });
      if(lens[j]>W-40){ txts[j].setAttribute('textLength',String(len-8)); txts[j].setAttribute('lengthAdjust','spacingAndGlyphs'); } else txts[j].removeAttribute('textLength');
    });
    grp.setAttribute('opacity','1');
    cur={spans:spans,len:len,x:x,y:y,lh:lh,t0:performance.now()};
  }
  function frame(now){
    if(cur){
      var t=now/1000, a=(now-cur.t0)/1000, n=cur.spans.length, step=(WRITE-EASE)/Math.max(1,n-1);
      [0,1].forEach(function(j){
        var pts=[], y0=cur.y+j*cur.lh;
        for(var x=0;x<=cur.len+24;x+=12){ var y=y0+(calmP?0:10*Math.sin(2*Math.PI*x/300+t*.5+j*.9)+4*Math.sin(2*Math.PI*x/140-t*.75)); pts.push((cur.x+x).toFixed(1)+' '+y.toFixed(1)); }
        paths[j].setAttribute('d','M'+pts.join(' L'));
      });
      cur.spans.forEach(function(sp,i){ var o=Math.max(0,Math.min(1,(a-i*step)/EASE)); sp.setAttribute('opacity',(o*o*(3-2*o)*.8).toFixed(3)); });
      var f=a-WRITE-HOLD; if(f>0) grp.setAttribute('opacity',Math.max(0,1-f/FADE).toFixed(3));
      if(f>FADE){ cur=null; setTimeout(begin,REST*1000); }
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
  setTimeout(begin,3000);
})();

/* Fusion's version of the two lines: every letter cut out on its own shard of paper, in the kaleidoscope's palette,
   laid in two rings that turn with the glass. Each chord change slaps down the next letters and jolts the rest;
   then the pieces fly apart, 15 s of nothing, again. Paused, letters land on a timer instead. */
(function(){
  var LINES=['Cut my reviews into pieces','This is my last retort'], ring=$('shardring'), pulse=$('shardpulse');
  var HOLD=6, SCATTER=6, REST=15, cur=null, spin=0;
  function g3(a,b,c,t){ t=clamp(t,0,1); var x=t<.5?t*2:t*2-1, u=t<.5?a:b, v=t<.5?b:c; return [0,1,2].map(function(i){ return u[i]+(v[i]-u[i])*x; }); }
  function palJS(t,k){   /* the shaders' palette, so the paper matches the glass */
    var cold=g3([.02,.04,.12],[.26,.48,.78],[.78,.84,.98],t), mid=g3([.01,.09,.11],[.16,.5,.52],[.93,.74,.78],t), warm=g3([.11,.02,.07],[.93,.42,.33],[1,.84,.55],t);
    var a=k<.5?cold:mid, b=k<.5?mid:warm, x=k<.5?k*2:k*2-1; return [0,1,2].map(function(i){ return Math.round(255*clamp(a[i]+(b[i]-a[i])*x,0,1)); });
  }
  function cutShape(){ var pts=[[0,0],[100,0],[100,100],[0,100]].map(function(q){ return (q[0]+(q[0]?-1:1)*Math.random()*14).toFixed(0)+'% '+(q[1]+(q[1]?-1:1)*Math.random()*14).toFixed(0)+'%'; }); return 'polygon('+pts.join(',')+')'; }
  function begin(){
    while(pulse.firstChild) pulse.removeChild(pulse.firstChild);
    var R0=Math.min(innerWidth,innerHeight)*.4, items=[];
    LINES.forEach(function(line,j){
      var R=j?R0*.78:R0, size=clamp(R0/5.5,18,40)*(j?.9:1), step=size*.66/R, a0=-step*(line.length-1)/2;
      line.split('').forEach(function(ch,i){
        var el=document.createElement('span'); el.className='shard'; el.textContent=ch;
        var t=.45+.5*Math.random(), col=palJS(t,temp);
        el.style.background=ch===' '?'transparent':'rgb('+col.join(',')+')'; if(ch===' ') el.style.filter='none';
        el.style.color=t>.62?'#05070B':'#EEF0F4';
        el.style.fontSize=(size*(.8+.45*Math.random())).toFixed(1)+'px'; el.style.fontStyle=Math.random()<.35?'italic':'normal'; el.style.fontWeight=Math.random()<.3?'700':'400';
        el.style.clipPath=cutShape();
        var a=a0+i*step, tilt=(Math.random()-.5)*22;
        el._home='translate(-50%,-50%) rotate('+a+'rad) translateY('+(-R)+'px) rotate('+tilt+'deg)';
        el.style.transform=el._home+' scale(1.9)';
        pulse.appendChild(el); items.push(el);
      });
    });
    cur={items:items, n:0, done:0, t0:performance.now()};
  }
  function land(k){
    if(!cur||cur.done) return;
    for(var i=0;i<k && cur.n<cur.items.length;i++){ var el=cur.items[cur.n++]; el.style.opacity='1'; el.style.transform=el._home+' scale(1)'; if(el.textContent===' ') i--; }
    if(cur.n>=cur.items.length){ cur.done=performance.now(); setTimeout(scatter,HOLD*1000); }
  }
  function scatter(){
    if(!cur) return; var c=cur;
    c.items.forEach(function(el){ el.style.transition='opacity '+SCATTER+'s ease-in,transform '+SCATTER+'s cubic-bezier(.15,.6,.3,1)';
      el.style.opacity='0'; el.style.transform=el._home+' translateY('+(-60-200*Math.random())+'px) rotate('+((Math.random()-.5)*160)+'deg) scale(.8)'; });
    setTimeout(function(){ if(cur===c){ cur=null; setTimeout(begin,REST*1000); } },SCATTER*1000);
  }
  FZ_CHORD=function(){ if(STATION!=='fusion') return; land(2);
    if(pulse.animate) pulse.animate([{transform:'scale(1.05)'},{transform:'scale(1)'}],{duration:220,easing:'ease-out'}); };
  setInterval(function(){ if(STATION==='fusion' && !playing) land(1); },350);
  (function frame(){ if(STATION==='fusion'){ spin=PV.rot; ring.style.transform='rotate('+spin+'rad)'; } requestAnimationFrame(frame); })();
  setTimeout(begin,2000);
})();

/* the information keeps out of the way: it fades while you listen and comes back when you move */
var quietTimer=null;
function poke(){ document.body.classList.remove('quiet'); clearTimeout(quietTimer); if(playing) quietTimer=setTimeout(function(){ if(playing) document.body.classList.add('quiet'); },5000); }
['pointermove','pointerdown','keydown','touchstart'].forEach(function(n){ window.addEventListener(n,poke,{passive:true}); });

/* Serious/Fun, as on toddlburns.com: the knob slides to Serious, then the serious site opens */
$('mode').addEventListener('click',function(e){ e.preventDefault(); var a=this; a.classList.remove('active'); setTimeout(function(){ location.href=a.href; },350); });

fetch('station.json').then(function(r){ return r.json(); }).then(function(d){
  ST=d.reviews; N=ST.length; EPOCH=Date.parse(d.epoch)/1000; var t=0; START=ST.map(function(R){ var s=t; t+=R.s; return s; }); TOTAL=t;
  var ri=reviewAt(stationNow()); temp=tempTarget=warmth(ST[ri].g); nowLine();
}).catch(function(){ $('now').textContent='The station schedule did not load. Reload the page.'; });
requestAnimationFrame(function(t){ last=t; frame(t); });

/* for checking levels without listening: render the station offline from any position */
window.CRR={
  render:function(at,secs){
    var oc=new OfflineAudioContext(2,Math.floor(44100*secs),44100), e=makeEngine(oc);
    return loadSound(oc).then(function(){
      e.newBus(); e.master.gain.value=MASTER; anchorCtx=0; anchorPos=at; var c=cursorAt(at), saved=cur; cur=c;
      var save=eng; eng=e; var H=secs; var HP=at+secs;
      for(var g=0;g<4000;g++){ var ws=prep(cur.ri).words; if(cur.wi>=ws.length){ cur.base+=ST[cur.ri].s; cur.ri=(cur.ri+1)%N; cur.wi=0; continue; }
        var w=ws[cur.wi], gs=cur.base+w.start; if(gs>HP) break; var t0=gs-at; if(t0+w.L>0) e.word(w,t0,cur.ri,cur.base,cur.base+ST[cur.ri].s-at); cur.wi++; }
      e.grainsUntil(H); eng=save; cur=saved;
      return oc.startRendering();
    });
  },
  renderBeat:function(kind,at,secs){
    var oc=new OfflineAudioContext(2,Math.floor(44100*secs),44100), e=makeEngine(oc);
    return loadSound(oc).then(function(){ beatCache={}; e.master.gain.value=MASTER; var b=makeBeat(oc,e.comp,kind,0,at,null); b.until(secs); return oc.startRendering(); });
  },
  factIn:function(){ var P=stationNow(), ri=reviewAt(P); return factFor(ri,START[ri]).at-P; },
  factsScheduled:function(){ return Object.keys(factsDone).length; },
  stingAt:function(){ return stingAt&&ctx ? stingAt-ctx.currentTime : null; },
  now:function(){ var P=stationNow(), ri=reviewAt(P); return {review:ST[ri], into:P-START[ri], total:TOTAL}; }
};
})();
