        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {

            padding: 60px 20px 80px;
        }
        .container {
            max-width: 620px;
            margin: 0 auto;
        }
        .back {

            color: #999;
            text-decoration: none;
            display: inline-block;
            margin-bottom: 40px;
        }
        .back:hover { color: #111; }
        h1 {
            font-size: 24px;

            margin-bottom: 20px;
        }
        .intro {
            font-size: 17px;
            line-height: 1.7;
            color: #333;
            margin-bottom: 12px;
        }
        .subscribe-link {

            font-size: 15px;
            color: #8b1a1a;
            text-decoration: none;
            margin-bottom: 40px;
        }
        .subscribe-link:hover { color: #111; }
        .playlist-list {
            list-style: none;
        }
        .playlist-list li {
            font-size: 16px;
            line-height: 1.5;
            padding: 4px 0;
            border-bottom: 1px solid #eee;
        }
        .playlist-list li:last-child {
            border-bottom: none;
        }
        .playlist-list a {
            color: #111;
            text-decoration: none;
        }
        .playlist-list a:hover {
            color: #8b1a1a;
        }
        .accordion {
            border-bottom: 1px solid #eee;
        }
        .accordion-header {
            font-size: 16px;
            line-height: 1.5;
            padding: 4px 0;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            user-select: none;
        }
        .accordion-header:hover {
            color: #8b1a1a;
        }
        .accordion-header .count {
            font-size: 12px;
            color: #999;
            margin-left: 8px;
        }
        .accordion-header .arrow {
            font-size: 12px;
            color: #999;
            transition: transform 0.2s;
        }
        .accordion-header.open .arrow {
            transform: rotate(90deg);
        }
        .accordion-body {
            display: none;
            padding-left: 20px;
        }
        .accordion-body.open {
            display: block;
        }
        .accordion-body li {
            border-bottom: 1px solid #f5f5f5;
        }
        .accordion-body li:last-child {
            border-bottom: none;
        }

        .page-toggle {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 100;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 12px;
            letter-spacing: 1px;
            user-select: none;
            cursor: pointer;
        }
        .page-toggle .toggle-track {
            width: 36px;
            height: 18px;
            border-radius: 9px;
            position: relative;
        }
        .page-toggle .knob {
            width: 14px;
            height: 14px;
            background: #fff;
            border-radius: 50%;
            position: absolute;
            top: 2px;
        }
        .page-toggle .toggle-label-left { color: #222; }
        .page-toggle .toggle-label-right { color: #ccc; }
        .page-toggle .toggle-track { background: #ccc; }
        .page-toggle .knob { left: 2px; }
    </style>

            }
            const prefix = p.name.substring(0, commaIdx).trim();
            if (!groups[prefix]) groups[prefix] = [];
            groups[prefix].push(p);
        });

        // Merge small groups back into standalone
        const accordions = {};
        Object.entries(groups).forEach(([prefix, items]) => {
            if (items.length >= 5) {
                accordions[prefix] = items;
            } else {
                standalone.push(...items);
            }
        });

        // Build combined sorted list of standalone items and accordion headers
        const allEntries = [];

        standalone.forEach(p => {
            allEntries.push({ type: 'single', name: p.name, sortKey: p.name, data: p });
        });

        Object.entries(accordions).forEach(([prefix, items]) => {
            allEntries.push({ type: 'accordion', name: prefix, sortKey: prefix, items: items });
        });

        allEntries.sort((a, b) => a.sortKey.localeCompare(b.sortKey));

        const container = document.getElementById('playlist-container');
        const ul = document.createElement('ul');
        ul.className = 'playlist-list';

        allEntries.forEach(entry => {
            if (entry.type === 'single') {
                const li = document.createElement('li');
                const a = document.createElement('a');
                a.href = 'https://open.spotify.com/playlist/' + entry.data.spotifyId;
                a.target = '_blank';
                a.textContent = entry.data.name;
                li.appendChild(a);
                ul.appendChild(li);
            } else {
                const wrapper = document.createElement('li');
                wrapper.className = 'accordion';
                wrapper.style.borderBottom = 'none';

                const header = document.createElement('div');
                header.className = 'accordion-header';
                header.innerHTML = `<span>${entry.name} <span class="count">(${entry.items.length})</span></span><span class="arrow">&#9654;</span>`;

                const body = document.createElement('ul');
                body.className = 'accordion-body playlist-list';

                entry.items.sort((a, b) => a.name.localeCompare(b.name));
                entry.items.forEach(p => {
                    const li = document.createElement('li');
                    const a = document.createElement('a');
                    a.href = 'https://open.spotify.com/playlist/' + p.spotifyId;
                    a.target = '_blank';
                    // Show just the part after the comma
                    const suffix = p.name.substring(p.name.indexOf(',') + 1).trim();
                    a.textContent = suffix;
                    li.appendChild(a);
                    body.appendChild(li);
                });

                header.addEventListener('click', () => {
                    header.classList.toggle('open');
                    body.classList.toggle('open');
                });

                wrapper.appendChild(header);
                wrapper.appendChild(body);
                ul.appendChild(wrapper);
            }
        });

        container.appendChild(ul);
    </script>
</body>
</html>
