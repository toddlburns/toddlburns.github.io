<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Playlists - Todd L. Burns</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0a0a0a;
            color: #e0e0e0;
            font-family: 'Courier New', monospace;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 30px 20px;
        }
        .back {
            font-size: 13px;
            color: #555;
            text-decoration: none;
            align-self: flex-start;
            max-width: 600px;
            width: 100%;
            margin: 0 auto 20px;
        }
        .back:hover { color: #aaa; }
        .intro {
            max-width: 600px;
            text-align: center;
            margin-bottom: 20px;
        }
        h1 {
            font-size: 22px;
            font-weight: 400;
            letter-spacing: 6px;
            text-transform: uppercase;
            color: #00ff00;
            text-shadow: 0 0 10px #00ff00;
            margin-bottom: 12px;
        }
        .desc {
            font-size: 14px;
            color: #888;
            line-height: 1.6;
            margin-bottom: 20px;
        }
        .globe-container {
            width: 100%;
            max-width: 500px;
            height: 500px;
            margin: 0 auto;
        }
        .globe-container iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
        .hint {
            font-size: 12px;
            color: #444;
            margin-top: 12px;
            text-align: center;
        }
    </style>
</head>
<body>
    <a href="/" class="back">&larr; toddlburns.com</a>
    <div class="intro">
        <h1>Crambe Repetita</h1>
        <p class="desc">A weekly themed playlist project running since 2022. A reflection of wide taste in music. Click the globe to explore.</p>
    </div>
    <div class="globe-container">
        <iframe src="https://toddlburns.github.io/globe-playlists/embed.html?speed=0.003&link=https://toddlburns.github.io/globe-playlists/" allow="accelerometer"></iframe>
    </div>
    <p class="hint">click the globe</p>
</body>
</html>
