        .playlist-list a {

            color: #8b1a1a;

        .playlist-list li.row {

            padding-left: 16px;
            display: flex;
            gap: 10px;
            flex-shrink: 0;
        }
        .playlist-list .elsewhere a {

            width: 18px;
            text-align: right;
        }
        .playlist-list .elsewhere a:hover {
            color: #8b1a1a;
        }
        .accordion {
            border-bottom: 1px solid #eee;
        }
        .accordion-header {
            font-size: 16px;
            line-height: 1.5;
            padding: 4px 0;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            user-select: none;
        }
        .accordion-header:hover {
            color: #8b1a1a;
        }
        .accordion-header .count {
            font-size: 12px;
            color: #999;
            margin-left: 8px;
        }
        .accordion-header .arrow {
            font-size: 12px;
            color: #999;
            transition: transform 0.2s;
        }
        .accordion-header.open .arrow {
            transform: rotate(90deg);
        }
        .accordion-body {
            display: none;
            padding-left: 20px;
        }
        .accordion-body.open {
            display: block;
        }
        .accordion-body li {
            border-bottom: 1px solid #f5f5f5;
        }
        .accordion-body li:last-child {
            border-bottom: none;
        }

        .page-toggle {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 100;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 12px;
            letter-spacing: 1px;
            user-select: none;
            cursor: pointer;
        }
        .page-toggle .toggle-track {
            width: 36px;
            height: 18px;
            border-radius: 9px;
            position: relative;
        }
        .page-toggle .knob {
            width: 14px;
            height: 14px;
            background: #fff;
            border-radius: 50%;
            position: absolute;
            top: 2px;
        }
        .page-toggle .toggle-label-left { color: #222; }
        .page-toggle .toggle-label-right { color: #ccc; }
        .page-toggle .toggle-track { background: #ccc; }
        .page-toggle .knob { left: 2px; }

"name": "Yet They Say, Vol. 4", "spotifyId": "0jmp8wWpPIkGWg5nm4LNwe"}, {"name": "Yet They Say, Vol. 5", "spotifyId": "0M6rPpreVz86WKq0Ag6kFO"}, {"name": "Yet They Say, Vol. 6", "spotifyId": "21MO7VSPe24bjCOtdt2wrg"}, {"name": "Yet They Say, Vol. 7", "spotifyId": "3DDwCdkwUPEcDQbdwGmjVW"}, {"name": "Yet They Say, Vol. 8", "spotifyId": "6sdKnK1EXsLMGGwikpV84x"}, {"name": "Yet They Say, Vol. 9", "spotifyId": "6phFkBNKX9DPKjczwMr0lx"}, {"name": "Zouk, Fast", "spotifyId": "0ZnY8eOB1DHCLdg2QG5Rjh"}, {"name": "Zouk, Slow", "spotifyId": "1dIQnuEk89elNqWJ2TwCP3"}, {"name": "Zouk, Smooth", "spotifyId": "751iikDbmoyjUBeWFSfWaN"}, {"name": "Zouk, Starter Pack", "spotifyId": "2rsEmyzKoYTgXerSjeB0IK"}, {"name": "Azonto / Hiplife", "spotifyId": "6Naq3yvuVoBL27KgY2Svf6"}, {"name": "Pr\u00edncipe, Chill", "spotifyId": "0s9M3fBKWFJmVhAiieCjkt"}, {"name": "Highlife, Vintage Peppy", "spotifyId": "4QjHU0dwRyFv8aP31CXmRx"}, {"name": "Rumba, Vintage", "spotifyId": "4q0CkBcLH3ceq6OB0PfUU8"}, {"name": "Tigrinya, Vintage", "spotifyId": "3BXK08wohNho0wCHBiiv9I"}, {"name": "Tigrinya", "spotifyId": "7do7DrHqlGF9Ft7NbtwGGL"}, {"name": "Sega", "spotifyId": "3G3NcjYPEyVjepUGzPUyxI"}, {"name": "Xitsonga / Tsonga, Downtempo", "spotifyId": "0mEs3YsF8hKDwj0HPznfT9"}, {"name": "Sega, Psych", "spotifyId": "4ARXoTlqKTuAQhg2k8HeJX"}, {"name": "Mbalax, Mark Ernestus", "spotifyId": "36iFMNygMeRRlL5SgWtmER"}, {"name": "Dr. Thomas Chauke", "spotifyId": "4rhVBRU9Qup1O5IYEKiIrs"}, {"name": "Worldwide, Chiming Guitar", "spotifyId": "4xIaYhRmf8rV4W7Kzy0Ssn"}, {"name": "Worldwide, Smooth Mid-Tempo R&B", "spotifyId": "01gAq5hKTsncsfQMc5XGTR"}, {"name": "Africa, Smooth Bangers", "spotifyId": "7fo8PWonDWZFvhR7ThcC9c"}, {"name": "Africa, Acoustic Bangers", "spotifyId": "5ZUk2gZ2DEbrAzuIdnbs6R"}, {"name": "Africa, Hype Bangers", "spotifyId": "1DnMnLRsztUXlnzqC2KhPB"}, {"name": "Igbo, Trips", "spotifyId": "24BPg0ssxlfyIcZgEKdpGv"}, {"name": "Worldwide, Chanting And Drumming", "spotifyId": "5zCl1AYh66oiLKfBM5yz3q"}, {"name": "Africa, Vintage", "spotifyId": "3qxhw7DmQrTXEQ3O58hWGd"}, {"name": "Afrobeats, Groovers", "spotifyId": "72zKIZG8bXjGHpQJW2DfUW"}, {"name": "Rock, Soft", "spotifyId": "5HpHVYYyaDgBnGlaPmLbyB"}, {"name": "Rock, Smooth", "spotifyId": "3FWefoSEYkM6sDCwo0fAxc"}];

        playlists.sort((a, b) => a.name.localeCompare(b.name));

        // Group by prefix (text before first comma)
        const groups = {};
        const standalone = [];

        playlists.forEach(p => {
            const commaIdx = p.name.indexOf(',');
            if (commaIdx === -1) {
                standalone.push(p);
                return;
            }
            const prefix = p.name.substring(0, commaIdx).trim();
            if (!groups[prefix]) groups[prefix] = [];
            groups[prefix].push(p);
        });

        // Merge small groups back into standalone
        const accordions = {};
        Object.entries(groups).forEach(([prefix, items]) => {
            if (items.length >= 5) {
                accordions[prefix] = items;
            } else {
                standalone.push(...items);
            }
        });

        // Build combined sorted list of standalone items and accordion headers
        const allEntries = [];

        standalone.forEach(p => {
            allEntries.push({ type: 'single', name: p.name, sortKey: p.name, data: p });
        });

        Object.entries(accordions).forEach(([prefix, items]) => {
            allEntries.push({ type: 'accordion', name: prefix, sortKey: prefix, items: items });
        });

        allEntries.sort((a, b) => a.sortKey.localeCompare(b.sortKey));

        // Other places to hear or buy each playlist: YouTube Music, and Hype Machine's
        // Merch Table (the playlist's albums that are on Bandcamp). The YT slot stays
        // empty when there is no YouTube copy, so the BC column lines up.
        function addElsewhere(li, p) {
            li.classList.add('row');
            const box = document.createElement('span');
            box.className = 'elsewhere';
            const links = [
                ['YT', 'YouTube Music', p.youtube && 'https://music.youtube.com/playlist?list=' + p.youtube],
                ['BC', 'Albums on Bandcamp', 'https://hypem.com/merch-table/' + p.spotifyId],
            ];
            links.forEach(([label, title, href]) => {
                const a = document.createElement('a');
                if (href) {
                    a.href = href;
                    a.target = '_blank';
                    a.title = title;
                    a.textContent = label;
                } else {
                    a.textContent = '\u00a0';
                }
                box.appendChild(a);
            });
            li.appendChild(box);
        }

        const container = document.getElementById('playlist-container');
        const ul = document.createElement('ul');
        ul.className = 'playlist-list';

        allEntries.forEach(entry => {
            if (entry.type === 'single') {
                const li = document.createElement('li');
                const a = document.createElement('a');
                a.href = 'https://open.spotify.com/playlist/' + entry.data.spotifyId;
                a.target = '_blank';
                a.textContent = entry.data.name;
                li.appendChild(a);
                addElsewhere(li, entry.data);
                ul.appendChild(li);
            } else {
                const wrapper = document.createElement('li');
                wrapper.className = 'accordion';
                wrapper.style.borderBottom = 'none';

                const header = document.createElement('div');
                header.className = 'accordion-header';
                header.innerHTML = `<span>${entry.name} <span class="count">(${entry.items.length})</span></span><span class="arrow">&#9654;</span>`;

                const body = document.createElement('ul');
                body.className = 'accordion-body playlist-list';

                entry.items.sort((a, b) => a.name.localeCompare(b.name));
                entry.items.forEach(p => {
                    const li = document.createElement('li');
                    const a = document.createElement('a');
                    a.href = 'https://open.spotify.com/playlist/' + p.spotifyId;
                    a.target = '_blank';
                    // Show just the part after the comma
                    const suffix = p.name.substring(p.name.indexOf(',') + 1).trim();
                    a.textContent = suffix;
                    li.appendChild(a);
                    addElsewhere(li, p);
                    body.appendChild(li);
                });

                header.addEventListener('click', () => {
                    header.classList.toggle('open');
                    body.classList.toggle('open');
                });

                wrapper.appendChild(header);
                wrapper.appendChild(body);
                ul.appendChild(wrapper);
            }
        });

        container.appendChild(ul);
    </script>
